# Internet-facing RVF, secured by Keycloak through oauth2-proxy.
#
# WHY THIS SHAPE
#
# RVF has no authentication and no authorisation of its own. Measured against a
# live instance:
#
#     X-AUTH-token: local                  -> 200
#     X-AUTH-token: totally-made-up-token  -> 200
#     X-AUTH-token: '' (empty)             -> 200
#     no X-AUTH-* headers                  -> 401
#
# `RequestHeaderAuthenticationDecorator` builds a
# `PreAuthenticatedAuthenticationToken` from `X-AUTH-username` / `-roles` /
# `-token` and validates none of them, and there is no `@PreAuthorize`,
# `@Secured` or `hasRole` anywhere in the codebase - so `X-AUTH-roles` gates
# nothing inside RVF. That is not a defect to work around: it is the design.
# SI runs RVF behind an identity service that sets those headers, and this is
# that service's replacement.
#
# Two consequences drive everything below:
#
#   1. **oauth2-proxy is the ONLY authorisation layer.** Anyone it lets through
#      can do anything RVF can do - submit runs, read every report, delete
#      releases. Hence `allowed_groups`, which is not optional.
#   2. **RVF must be unreachable except through the proxy.** The `rvf-api`
#      Service stays ClusterIP and the Ingress points at oauth2-proxy, never at
#      `rvf-api`. An Ingress that reached RVF directly would be an open door
#      regardless of what else is configured here.
#
# WHY oauth2-proxy AS A PROXY, NOT AS auth_request
#
# ingress-nginx's `auth-url` pattern leaves the ingress forwarding the original
# request, so translating oauth2-proxy's `X-Auth-Request-*` response headers into
# RVF's `X-AUTH-*` needs a `configuration-snippet` - and snippet annotations are
# disabled by default since ingress-nginx 1.9 (CVE-2021-25742). Putting
# oauth2-proxy in the request path instead lets it inject the exact header names
# RVF wants, with no snippets and no cluster-wide policy change.
#
# NOT YET APPLIED. Written 2026-09-03 with no cluster access. The realm, client
# and group names are placeholders; the acceptance tests at the bottom are the
# part to actually run.
---
apiVersion: v1
kind: Secret
metadata: { name: rvf-oauth2-proxy, namespace: rvf }
type: Opaque
stringData:
  # From the Keycloak client. client-secret is the confidential client's secret;
  # cookie-secret must be 16, 24 or 32 bytes, base64url:
  #     openssl rand -base64 32 | tr -- '+/' '-_'
  client-id: "rvf"
  client-secret: "REPLACE_ME"
  cookie-secret: "REPLACE_ME"
---
apiVersion: v1
kind: ConfigMap
metadata: { name: rvf-oauth2-proxy, namespace: rvf }
data:
  # Alpha config, because only it can inject ARBITRARY header names. The
  # flag-based config can set X-Auth-Request-* and nothing else, and RVF reads
  # X-AUTH-username / X-AUTH-roles / X-AUTH-token.
  oauth2-proxy.yaml: |
    upstreams:
      - id: rvf
        path: /
        uri: http://rvf-api.rvf.svc.cluster.local:8080
        # An 853MB release upload must not be buffered in the proxy.
        flushInterval: 1s

    injectRequestHeaders:
      - name: X-AUTH-username
        values:
          - claimSource:
              claim: preferred_username
      # MUST be comma separated: RVF passes this straight to
      # AuthorityUtils.commaSeparatedStringToAuthorityList. Verify the joining
      # for a multi-valued claim on your oauth2-proxy version - see the
      # acceptance tests.
      - name: X-AUTH-roles
        values:
          - claimSource:
              claim: rvf_roles
      # RVF does not validate this, but it FORWARDS it to the traceability and
      # acceptance-gateway clients, so a real access token is the useful value.
      - name: X-AUTH-token
        values:
          - claimSource:
              claim: access_token

    # Belt and braces. oauth2-proxy strips headers it is going to set itself,
    # but the three above are custom names, so do not rely on that alone -
    # prove it with the spoofing test at the bottom.
    injectResponseHeaders: []

    server:
      BindAddress: 0.0.0.0:4180

    providers:
      - id: keycloak
        provider: oidc
        clientID: rvf
        clientSecretFile: /secrets/client-secret
        oidcConfig:
          issuerURL: https://KEYCLOAK_HOST/realms/REALM
          emailClaim: email
          groupsClaim: groups
          userIDClaim: preferred_username
          audienceClaims: [aud]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: rvf-oauth2-proxy, namespace: rvf }
spec:
  replicas: 2
  selector: { matchLabels: { app: rvf-oauth2-proxy } }
  template:
    metadata: { labels: { app: rvf-oauth2-proxy } }
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.14.0
          args:
            - --alpha-config=/config/oauth2-proxy.yaml
            - --cookie-secret-file=/secrets/cookie-secret
            # Behind ingress-nginx, so X-Forwarded-* can be trusted.
            - --reverse-proxy=true
            # THE authorisation rule. Without this, every authenticated
            # Keycloak user in the realm can run and read everything, because
            # RVF itself checks no roles.
            - --allowed-group=rvf-users
            # Machine clients (SI submitting a release from their CI) present a
            # Bearer JWT rather than a browser cookie. Despite the name this
            # ENABLES bearer validation.
            - --skip-jwt-bearer-tokens=true
            # An API client with a bad token should get 401, not a 302 to a
            # login page it cannot follow.
            - --bearer-token-login-fallback=false
            # Only needed if SI's service-account tokens carry a different
            # audience from this client:
            # - --extra-jwt-issuers=https://KEYCLOAK_HOST/realms/REALM=si-rvf-client
            - --email-domain=*
            - --cookie-secure=true
            - --cookie-samesite=lax
          ports: [{ containerPort: 4180 }]
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: secrets, mountPath: /secrets, readOnly: true }
          readinessProbe:
            httpGet: { path: /ping, port: 4180 }
            initialDelaySeconds: 5
          resources:
            requests: { memory: 64Mi, cpu: 50m }
            limits: { memory: 256Mi }
      volumes:
        - { name: config, configMap: { name: rvf-oauth2-proxy } }
        - name: secrets
          secret:
            secretName: rvf-oauth2-proxy
            items:
              - { key: client-secret, path: client-secret }
              - { key: cookie-secret, path: cookie-secret }
---
apiVersion: v1
kind: Service
metadata: { name: rvf-oauth2-proxy, namespace: rvf }
spec:
  selector: { app: rvf-oauth2-proxy }
  ports: [{ port: 4180, targetPort: 4180 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rvf
  namespace: rvf
  annotations:
    # THIS CLUSTER RUNS NGINX INC'S CONTROLLER, not the community one. Read
    # 2026-09-03: every ingressclass on ncts-k8s-cluster reports
    # controller=nginx.org/ingress-controller. So the annotation family is
    # `nginx.org/*`; the community `nginx.ingress.kubernetes.io/*` annotations
    # this file used to carry are silently IGNORED by it - which would have
    # meant the default 1MB body limit quietly rejecting an 853MB release.
    #
    # A release is 853MB.
    nginx.org/client-max-body-size: "2g"
    # Do not spool a multi-hundred-megabyte body before forwarding a byte.
    nginx.org/proxy-buffering: "false"
    nginx.org/proxy-read-timeout: "600s"
    nginx.org/proxy-send-timeout: "600s"
    # The issuer is named `letsencrypt` on this cluster, not letsencrypt-prod.
    cert-manager.io/cluster-issuer: letsencrypt
    # Matching the house style used by the ontoserver/fhirpit ingresses here.
    cert-manager.io/issue-temporary-certificate: "true"
    acme.cert-manager.io/http01-edit-in-place: "true"
spec:
  # NO DEFAULT INGRESS CLASS EXISTS. This cluster runs one nginx controller per
  # application - ontoserver-amtv4-nginx, ontoserver-fhirpit-r4-nginx,
  # llm2hse-nginx-hse and so on - so RVF needs its own class and controller
  # deployment following that pattern. Fill this in with the class whoever owns
  # the cluster creates; it cannot be guessed.
  ingressClassName: REPLACE_WITH_RVF_INGRESS_CLASS
  tls:
    - hosts: [RVF_PUBLIC_HOST]
      secretName: rvf-tls
  rules:
    - host: RVF_PUBLIC_HOST
      http:
        paths:
          # Everything, including /oauth2/* which oauth2-proxy serves itself.
          # NOTE the backend is the PROXY. Pointing any path at rvf-api would
          # bypass authentication entirely.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rvf-oauth2-proxy
                port: { number: 4180 }
---
# Defence in depth: even if an Ingress is later pointed at rvf-api by mistake,
# only the proxy can reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: rvf-api-proxy-only, namespace: rvf }
spec:
  podSelector: { matchLabels: { app: rvf-api } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: rvf-oauth2-proxy } }
      ports: [{ port: 8080 }]
  # NOTE there is deliberately no second rule. An ingress rule with `from: []`
  # means "from anywhere" and would silently negate the one above - it looks
  # like a policy and is not one.
  #
  # Kubelet readiness probes originate from the node, not from a pod, and most
  # CNIs exempt them. If yours does not, the API pods will go NotReady on
  # apply - add the node CIDR rather than widening the rule:
  #
  #   - from:
  #       - ipBlock: { cidr: <node-subnet>/24 }
  #     ports: [{ port: 8080 }]
