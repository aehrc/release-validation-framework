name: rvf-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - 'groups-api-fix'
      - 'support-stored-proc-file'
      # Weekly merges of SNOMED International's master (.github/workflows/upstream-sync.yml on
      # master). Each builds an image the upstream-sync-rvf pipeline then validates (aehrc/rvf#48).
      - 'upstream-sync/*'
pool:
  vmImage: 'ubuntu-latest'

variables:
  mavenCache: $(Pipeline.Workspace)/.m2/repository
  mavenOptions: '-Dmaven.repo.local=$(mavenCache)'
  # Only the production branch may publish `latest` - that is the tag
  # values.yaml pins, so anything else pushing it silently replaces what the
  # nightly runs. Every other branch publishes under its own name, which is
  # also what the :catchup image needs.
  ${{ if eq(variables['Build.SourceBranchName'], 'groups-api-fix') }}:
    imageTag: 'latest'
  # upstream-sync/2026-10-05 -> upstream-sync-2026-10-05: SourceBranchName alone would be the
  # bare date, which says nothing about what the image is.
  ${{ elseif(startsWith(variables['Build.SourceBranch'], 'refs/heads/upstream-sync/')) }}:
    imageTag: upstream-sync-$(Build.SourceBranchName)
  ${{ else }}:
    imageTag: $(Build.SourceBranchName)

stages:
  - stage: build
    displayName: Build
    jobs:
      - job: build
        displayName: Build
        steps:
          - task: Cache@2
            displayName: Cache Maven local repo
            inputs:
              key: 'maven | "$(Agent.OS)" | **/pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
                maven
              path: $(mavenCache)
          - task: MavenAuthenticate@0
            inputs:
              artifactsFeeds: 'mavenbuild'
          - task: Docker@2
            inputs:
              containerRegistry: $(acr_registry)
              command: 'login'
          - task: Maven@3
            displayName: Build and verify
            inputs:
              mavenPomFile: 'pom.xml'
              options: '-Ddocker.image.prefix=$(acr_repo) -Ddocker.image.tag=$(imageTag)'
              mavenOptions: '$(mavenOptions)'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.17'
              jdkArchitectureOption: 'x64'
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              goals: 'clean install dockerfile:build dockerfile:push'
