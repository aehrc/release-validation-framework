suite: test persistent volume claims
templates:
  - pvc-jobs.yaml
  - pvc-releases.yaml
tests:
  - it: should render jobs and releases PVCs with default values
    set:
      fullnameOverride: "rvf"
    asserts:
      - isKind:
          of: PersistentVolumeClaim
        template: pvc-jobs.yaml
      - equal:
          path: metadata.name
          value: rvf-jobs
        template: pvc-jobs.yaml
      - equal:
          path: spec.storageClassName
          value: azurefile-csi-premium
        template: pvc-jobs.yaml
      - equal:
          path: spec.accessModes[0]
          value: ReadWriteMany
        template: pvc-jobs.yaml
      - equal:
          path: spec.resources.requests.storage
          value: 100Gi
        template: pvc-jobs.yaml
      - isKind:
          of: PersistentVolumeClaim
        template: pvc-releases.yaml
      - equal:
          path: metadata.name
          value: rvf-releases
        template: pvc-releases.yaml
      - equal:
          path: spec.storageClassName
          value: azurefile-csi-premium
        template: pvc-releases.yaml
      - equal:
          path: spec.resources.requests.storage
          value: 50Gi
        template: pvc-releases.yaml

  - it: should not render PVCs when create is false
    set:
      persistence.jobs.create: false
      persistence.releases.create: false
    asserts:
      - hasDocuments:
          count: 0
        template: pvc-jobs.yaml
      - hasDocuments:
          count: 0
        template: pvc-releases.yaml

  # The shape the NCTS deployment actually runs: static PVs on
  # blob.csi.azure.com, created in aehrc/ncts-argo because a PV is
  # cluster-scoped and outlives the release, and bound by name from here.
  - it: should bind a pre-created volume when volumeName is set
    set:
      fullnameOverride: "rvf"
      persistence.jobs.storageClassName: ""
      persistence.jobs.volumeName: "rvf-jobs-pv"
      persistence.releases.storageClassName: ""
      persistence.releases.volumeName: "rvf-releases-pv"
    asserts:
      - equal:
          path: spec.volumeName
          value: rvf-jobs-pv
        template: pvc-jobs.yaml
      # Empty, not absent: with the key absent the cluster's default class
      # provisions a NEW empty volume, and a job store that has silently lost
      # every report reads exactly like a fresh install.
      - equal:
          path: spec.storageClassName
          value: ""
        template: pvc-jobs.yaml
      - equal:
          path: spec.volumeName
          value: rvf-releases-pv
        template: pvc-releases.yaml

  - it: should omit volumeName when provisioning dynamically
    set:
      fullnameOverride: "rvf"
    asserts:
      - notExists:
          path: spec.volumeName
        template: pvc-jobs.yaml
      - notExists:
          path: spec.volumeName
        template: pvc-releases.yaml
