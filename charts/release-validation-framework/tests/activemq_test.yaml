suite: test activemq deployment, service and configmap
templates:
  - activemq-deployment.yaml
  - activemq-service.yaml
  - activemq-configmap.yaml
tests:
  - it: should render activemq deployment and service with default values
    set:
      fullnameOverride: "rvf"
    asserts:
      - isKind:
          of: Deployment
        template: activemq-deployment.yaml
      - equal:
          path: metadata.name
          value: activemq
        template: activemq-deployment.yaml
      - equal:
          path: spec.replicas
          value: 1
        template: activemq-deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].image
          value: apache/activemq-classic:6.1.4
        template: activemq-deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 61616
        template: activemq-deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].ports[1].containerPort
          value: 8161
        template: activemq-deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 200m
        template: activemq-deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 1Gi
        template: activemq-deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: activemq-config
        template: activemq-deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /opt/apache-activemq/conf/activemq.xml
        template: activemq-deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].subPath
          value: activemq.xml
        template: activemq-deployment.yaml
      - equal:
          path: spec.template.spec.volumes[0].name
          value: activemq-config
        template: activemq-deployment.yaml
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: activemq-config
        template: activemq-deployment.yaml
      - isKind:
          of: ConfigMap
        template: activemq-configmap.yaml
      - equal:
          path: metadata.name
          value: activemq-config
        template: activemq-configmap.yaml
      - matchRegex:
          path: data["activemq.xml"]
          pattern: '<queue physicalName="rvf-validation-queue" />'
        template: activemq-configmap.yaml
      - isKind:
          of: Service
        template: activemq-service.yaml
      - equal:
          path: metadata.name
          value: activemq
        template: activemq-service.yaml
      - equal:
          path: spec.ports[0].port
          value: 61616
        template: activemq-service.yaml
      - equal:
          path: spec.ports[1].port
          value: 8161
        template: activemq-service.yaml

  - it: should not render activemq when disabled
    set:
      activemq.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: activemq-deployment.yaml
      - hasDocuments:
          count: 0
        template: activemq-service.yaml
      - hasDocuments:
          count: 0
        template: activemq-configmap.yaml
