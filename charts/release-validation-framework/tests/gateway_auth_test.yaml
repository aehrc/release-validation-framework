suite: test gateway, routing, policies and networkpolicy
templates:
  - gateway.yaml
  - issuer.yaml
  - httproute.yaml
  - backend-traffic-policy.yaml
  - client-traffic-policy.yaml
  - security-policy.yaml
  - external-secret.yaml
  - networkpolicy.yaml
tests:
  - it: should render all gateway and auth resources with default values
    set:
      fullnameOverride: "rvf"
    asserts:
      - isKind:
          of: Gateway
        template: gateway.yaml
      - equal:
          path: metadata.name
          value: rvf-gw
        template: gateway.yaml
      - equal:
          path: spec.gatewayClassName
          value: envoy-gateway-class
        template: gateway.yaml
      - equal:
          path: metadata.annotations["cert-manager.io/issuer"]
          value: letsencrypt-rvf
        template: gateway.yaml
      - equal:
          path: metadata.annotations["cert-manager.io/issue-temporary-certificate"]
          value: "true"
        template: gateway.yaml
      - equal:
          path: metadata.annotations["acme.cert-manager.io/http01-edit-in-place"]
          value: "true"
        template: gateway.yaml
      - equal:
          path: spec.listeners[0].name
          value: public-http
        template: gateway.yaml
      - equal:
          path: spec.listeners[0].port
          value: 80
        template: gateway.yaml
      - equal:
          path: spec.listeners[1].name
          value: websecure
        template: gateway.yaml
      - equal:
          path: spec.listeners[1].port
          value: 443
        template: gateway.yaml
      - equal:
          path: spec.listeners[1].hostname
          value: ncts-rvf.australiaeast.cloudapp.azure.com
        template: gateway.yaml
      - equal:
          path: spec.listeners[1].tls.certificateRefs[0].name
          value: rvf-tls
        template: gateway.yaml
      - isKind:
          of: HTTPRoute
        template: httproute.yaml
      - equal:
          path: metadata.name
          value: rvf-route
        template: httproute.yaml
      - equal:
          path: spec.parentRefs[0].name
          value: rvf-gw
        template: httproute.yaml
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: rvf-api
        template: httproute.yaml
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 8080
        template: httproute.yaml
      - isKind:
          of: BackendTrafficPolicy
        template: backend-traffic-policy.yaml
      - equal:
          path: metadata.name
          value: rvf-timeouts
        template: backend-traffic-policy.yaml
      - equal:
          path: spec.timeout.http.requestTimeout
          value: 600s
        template: backend-traffic-policy.yaml
      - isKind:
          of: ClientTrafficPolicy
        template: client-traffic-policy.yaml
      - equal:
          path: metadata.name
          value: rvf-client
        template: client-traffic-policy.yaml
      - equal:
          path: spec.connection.bufferLimit
          value: 32Mi
        template: client-traffic-policy.yaml
      - isKind:
          of: SecurityPolicy
        template: security-policy.yaml
      - equal:
          path: metadata.name
          value: rvf-auth-policy
        template: security-policy.yaml
      - equal:
          path: spec.authorization.defaultAction
          value: Deny
        template: security-policy.yaml
      - equal:
          path: spec.authorization.rules[0].principal.jwt.claims[0].values[0]
          value: rvf-users
        template: security-policy.yaml
      - equal:
          path: spec.oidc.clientID
          value: rvf
        template: security-policy.yaml
      - isKind:
          of: ExternalSecret
        template: external-secret.yaml
      - equal:
          path: metadata.name
          value: rvf-oidc
        template: external-secret.yaml
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"
        template: external-secret.yaml
      - equal:
          path: spec.secretStoreRef.name
          value: vault-backend
        template: external-secret.yaml
      - equal:
          path: spec.data[0].remoteRef.key
          value: acl_vlt_od225632/kv/data/rvf
        template: external-secret.yaml
      - isKind:
          of: NetworkPolicy
        template: networkpolicy.yaml
      - equal:
          path: metadata.name
          value: rvf-api-gateway-only
        template: networkpolicy.yaml
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: envoy-gateway-system
        template: networkpolicy.yaml
      - isKind:
          of: Issuer
        template: issuer.yaml
      - equal:
          path: metadata.name
          value: letsencrypt-rvf
        template: issuer.yaml
      - isNull:
          path: spec.acme.email
        template: issuer.yaml
      - equal:
          path: spec.acme.solvers[0].http01.gatewayHTTPRoute.parentRefs[0].name
          value: rvf-gw
        template: issuer.yaml

  - it: should not render gateway or traffic policies when disabled
    set:
      gateway.enabled: false
      httpRoute.enabled: false
      securityPolicy.enabled: false
      externalSecret.enabled: false
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: gateway.yaml
      - hasDocuments:
          count: 0
        template: issuer.yaml
      - hasDocuments:
          count: 0
        template: httproute.yaml
      - hasDocuments:
          count: 0
        template: backend-traffic-policy.yaml
      - hasDocuments:
          count: 0
        template: client-traffic-policy.yaml
      - hasDocuments:
          count: 0
        template: security-policy.yaml
      - hasDocuments:
          count: 0
        template: external-secret.yaml
      - hasDocuments:
          count: 0
        template: networkpolicy.yaml

  - it: should support custom cert-manager ClusterIssuer when issuer.create is false
    set:
      certmanager.issuer.create: false
      certmanager.clusterIssuerName: "custom-issuer"
    asserts:
      - equal:
          path: metadata.annotations["cert-manager.io/cluster-issuer"]
          value: "custom-issuer"
        template: gateway.yaml
      - hasDocuments:
          count: 0
        template: issuer.yaml

  - it: should support custom cert-manager Issuer name and privateKeySecretRef
    set:
      fullnameOverride: "rvf"
      certmanager.issuerName: "my-custom-issuer"
      certmanager.issuer.email: "admin@example.com"
      certmanager.issuer.privateKeySecretRef: "my-custom-key"
    asserts:
      - equal:
          path: metadata.annotations["cert-manager.io/issuer"]
          value: "my-custom-issuer"
        template: gateway.yaml
      - equal:
          path: metadata.name
          value: "my-custom-issuer"
        template: issuer.yaml
      - equal:
          path: spec.acme.email
          value: "admin@example.com"
        template: issuer.yaml
      - equal:
          path: spec.acme.privateKeySecretRef.name
          value: "my-custom-key"
        template: issuer.yaml
      - equal:
          path: spec.acme.solvers[0].http01.gatewayHTTPRoute.parentRefs[0].name
          value: "rvf-gw"
        template: issuer.yaml

  - it: should include email in issuer when certmanager.issuer.email is configured
    set:
      fullnameOverride: "rvf"
      certmanager.issuer.email: "test@example.com"
    asserts:
      - isKind:
          of: Issuer
        template: issuer.yaml
      - equal:
          path: spec.acme.email
          value: test@example.com
        template: issuer.yaml
