suite: test worker deployment
templates:
  - worker-deployment.yaml
tests:
  - it: should render worker deployment with default values
    set:
      fullnameOverride: "rvf"
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: rvf-worker
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 600
      - equal:
          path: spec.template.spec.nodeSelector.agentpool
          value: large
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: node-type
            operator: Equal
            value: large-production
            effect: NoSchedule
      - equal:
          path: spec.template.spec.containers[0].name
          value: rvf
      - equal:
          path: spec.template.spec.containers[0].image
          value: ontoserver.azurecr.io/aehrc-rvf/release-validation-framework:9.0.1-duckdb
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "4"
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 12Gi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "8"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 16Gi
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RVF_EXECUTION_ISWORKER
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RVF_DUCK_WORK_DIRECTORY
            value: "/work"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RVF_DUCK_THREADS
            value: "8"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RVF_VALIDATION_JOB_RETENTION_DAYS
            value: "0"
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: work
            mountPath: /work
      - equal:
          path: spec.template.spec.volumes[2].emptyDir.sizeLimit
          value: 40Gi
