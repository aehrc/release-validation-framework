suite: test worker deployment
templates:
  - worker-deployment.yaml
tests:
  - it: should render worker deployment with default values
    set:
      fullnameOverride: "rvf"
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: rvf-worker
      # KEDA owns spec.replicas by default, so the Deployment must NOT declare
      # it. Declaring it makes ArgoCD selfHeal fight KEDA: scale to zero on an
      # empty queue, selfHeal restores 1, KEDA scales it away again.
      - notExists:
          path: spec.replicas
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 600
      - equal:
          path: spec.template.spec.nodeSelector.agentpool
          value: large
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: node-type
            operator: Equal
            value: large-production
            effect: NoSchedule
      - equal:
          path: spec.template.spec.containers[0].name
          value: rvf
      - equal:
          path: spec.template.spec.containers[0].image
          value: nctsacr.azurecr.io/aehrc-rvf/release-validation-framework:9.0.1-duckdb
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "4"
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 12Gi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "8"
      # 24Gi, not 16Gi. A worker holds two editions whenever a previous release
      # is supplied - Drools and MRCM load both to compare them - and at 16Gi the
      # first such run was OOMKilled four times, pegged at 16.0 of 16.0 GiB.
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 24Gi
      # DuckDB cannot see the container limit: its default is 80% of HOST RAM,
      # so on a 30Gi node it plans for ~24GB inside a 24Gi box already holding
      # an 18Gi heap. It has to be told.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RVF_DUCK_MEMORY_LIMIT
            value: "4GB"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RVF_EXECUTION_ISWORKER
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RVF_DUCK_WORK_DIRECTORY
            value: "/work"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RVF_DUCK_THREADS
            value: "8"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RVF_VALIDATION_JOB_RETENTION_DAYS
            value: "0"
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: work
            mountPath: /work
      - equal:
          path: spec.template.spec.volumes[2].emptyDir.sizeLimit
          value: 40Gi

  - it: should declare replicas again when KEDA is not managing the Deployment
    set:
      fullnameOverride: "rvf"
      keda.enabled: false
      worker.replicaCount: 2
    asserts:
      # Nothing else owns the field now, so the chart must set it - otherwise
      # the Deployment silently falls back to the Kubernetes default of 1 and
      # worker.replicaCount stops meaning anything.
      - equal:
          path: spec.replicas
          value: 2

  - it: should not declare replicas when only the ScaledObject is switched off
    set:
      fullnameOverride: "rvf"
      keda.scaledObject.enabled: false
    asserts:
      # keda.enabled stays true here, so this pins the exact condition: it is
      # the ScaledObject existing that decides who owns spec.replicas.
      - equal:
          path: spec.replicas
          value: 1

  # Assertion pack pins. The ORDER of these two env vars is the whole point:
  # Kubernetes expands $(NAME) only against a variable declared earlier in the
  # same container, so a spec rendered before its token would reach the engine
  # as the literal string "$(RVF_PACK_TOKEN_0)" and the fetch would 401.
  - it: should render a pinned pack with its token declared first
    set:
      fullnameOverride: "rvf"
      assertionPacks:
        - name: amtv4
          version: "2026.09.1"
          uri: "https://api.github.com/repos/aehrc/rvf/releases/assets/565830386"
          sha256: "sha256:2b001864"
          tokenSecret:
            name: rvf-assertion-pack-tokens
            key: github-pat
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RVF_PACK_TOKEN_0
            valueFrom:
              secretKeyRef:
                name: rvf-assertion-pack-tokens
                key: github-pat
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RVF_ASSERTION_PACKS
            value: "name=amtv4;version=2026.09.1;uri=https://api.github.com/repos/aehrc/rvf/releases/assets/565830386;sha256=sha256:2b001864;authHeader=Bearer $(RVF_PACK_TOKEN_0)"

  # A public pack needs no secret, and must not get an empty authHeader - an
  # Authorization header with nothing after the scheme is a 401, not a no-op.
  - it: should omit the authorization header for a pack that needs no token
    set:
      fullnameOverride: "rvf"
      assertionPacks:
        - name: international-extra
          version: "1.0.0"
          uri: "file:/app/releases/extra.json"
          sha256: "sha256:abc123"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RVF_ASSERTION_PACKS
            value: "name=international-extra;version=1.0.0;uri=file:/app/releases/extra.json;sha256=sha256:abc123"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: RVF_PACK_TOKEN_0

  # The default must stay inert: an empty list means the image's corpus is the
  # whole corpus, which is what every deployment that does not pin a pack wants.
  - it: should declare no pack environment by default
    set:
      fullnameOverride: "rvf"
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: RVF_ASSERTION_PACKS

  # A channel lets the pin be a version and nothing else, which is the whole
  # point: a pipeline variable holds "amtv4@2026.09.3" and no digest is
  # transcribed anywhere. The channel token must be declared before the specs
  # that reference it, same as the pack token.
  - it: should render a channel and a shorthand pin
    set:
      fullnameOverride: "rvf"
      assertionChannels:
        - name: amtv4
          index: "https://api.example/index.json"
          packs: amtv4
          tokenSecret:
            name: rvf-assertion-pack-tokens
            key: github-pack-token
      assertionPacks:
        - name: amtv4
          version: "2026.09.2"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RVF_ASSERTION_CHANNELS
            value: "name=amtv4;index=https://api.example/index.json;packs=amtv4;authHeader=Bearer $(RVF_CHANNEL_TOKEN_0)"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RVF_ASSERTION_PACKS
            value: "amtv4@2026.09.2"

  # Without a channel there is nowhere to resolve a version from, so an
  # unpinned pack must fail at template time rather than at fetch time on a
  # rolling deployment.
  - it: should refuse a pack with no digest and no channel
    set:
      fullnameOverride: "rvf"
      assertionPacks:
        - name: amtv4
          version: "2026.09.2"
    asserts:
      - failedTemplate:
          errorMessage: "assertionPacks[0] (amtv4) has no sha256 and no channel serves it: an unpinned pack cannot be reproduced, so a report naming it would mean nothing. Give it a uri and sha256, or configure a channel that carries it and name only the version."

  # No test for a channel with no index: values.schema.json declares index
  # required, so helm refuses those values before any template runs. A test
  # there would assert helm's own error wording and nothing of ours.
