{{- if .Values.persistence.releases.create }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "release-validation-framework.releasesPvcName" . }}
  annotations:
    # This claim holds uploaded and kept RF2 packages - hundreds of megabytes
    # each, some of them the only copy of a release someone published by hand.
    #
    # Both annotations exist because either mechanism alone leaves a way to
    # lose it: `helm.sh/resource-policy: keep` stops a helm uninstall taking
    # it, and the Argo sync-options stop a prune or an app deletion doing the
    # same. The volumes ALSO need `persistentVolumeReclaimPolicy: Retain`,
    # which is a property of the PV rather than the claim, so it comes from the
    # storage class or a manual patch - the dynamically provisioned Azure Files
    # PVs defaulted to Delete, meaning deleting this app deleted the data.
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    {{- with .Values.persistence.releases.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  labels:
    {{- include "release-validation-framework.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.releases.accessModes | nindent 4 }}
  storageClassName: {{ .Values.persistence.releases.storageClassName | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.releases.size | quote }}
{{- end }}
