{{- if and .Values.httpRoute.enabled .Values.httpRoute.backendTrafficPolicy.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "release-validation-framework.backendTrafficPolicyName" . }}
  labels:
    {{- include "release-validation-framework.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "release-validation-framework.httpRouteName" . }}
  timeout:
    http:
      requestTimeout: {{ .Values.httpRoute.backendTrafficPolicy.requestTimeout }}
      connectionIdleTimeout: {{ .Values.httpRoute.backendTrafficPolicy.connectionIdleTimeout }}
{{- end }}
