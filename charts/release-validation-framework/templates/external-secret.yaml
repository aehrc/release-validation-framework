{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "release-validation-framework.externalSecretName" . }}
  labels:
    {{- include "release-validation-framework.labels" . | nindent 4 }}
  {{- if or .Values.externalSecret.annotations .Values.externalSecret.syncWave }}
  annotations:
    {{- with .Values.externalSecret.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.externalSecret.syncWave }}
    argocd.argoproj.io/sync-wave: {{ .Values.externalSecret.syncWave | quote }}
    {{- end }}
  {{- end }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ .Values.externalSecret.target.name }}
    creationPolicy: {{ .Values.externalSecret.target.creationPolicy }}
  {{- if .Values.externalSecret.data }}
  data:
    {{- toYaml .Values.externalSecret.data | nindent 4 }}
  {{- end }}
  {{- if .Values.externalSecret.dataFrom }}
  dataFrom:
    {{- toYaml .Values.externalSecret.dataFrom | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.keda.enabled .Values.keda.triggerAuthentication.enabled .Values.keda.triggerAuthentication.externalSecret.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.keda.triggerAuthentication.secretName }}
  labels:
    {{- include "release-validation-framework.labels" . | nindent 4 }}
  {{- if .Values.externalSecret.syncWave }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.externalSecret.syncWave | quote }}
  {{- end }}
spec:
  refreshInterval: {{ .Values.keda.triggerAuthentication.externalSecret.refreshInterval | default .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.keda.triggerAuthentication.externalSecret.secretStoreRef.name | default .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.keda.triggerAuthentication.externalSecret.secretStoreRef.kind | default .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ .Values.keda.triggerAuthentication.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.keda.triggerAuthentication.usernameKey }}
      remoteRef:
        key: {{ .Values.keda.triggerAuthentication.externalSecret.remoteRef.key }}
        property: {{ .Values.keda.triggerAuthentication.externalSecret.remoteRef.usernameProperty }}
    - secretKey: {{ .Values.keda.triggerAuthentication.passwordKey }}
      remoteRef:
        key: {{ .Values.keda.triggerAuthentication.externalSecret.remoteRef.key }}
        property: {{ .Values.keda.triggerAuthentication.externalSecret.remoteRef.passwordProperty }}
{{- end }}

{{/*
Pack tokens get their OWN secret, deliberately.

An ExternalSecret sync is all-or-nothing: one `data` entry that cannot resolve
means the whole target secret fails to materialise. The pack token was first
added as a second key on the ExternalSecret that owns `rvf-oidc` - which is the
SecurityPolicy's OIDC clientSecret. The property did not resolve, the secret did
not materialise, the gateway lost its client secret, and it stopped injecting
the X-AUTH headers RVF authenticates on. Every endpoint answered 401 until the
change was reverted: a nightly-assertions token took production authentication
down with it.

Separate secret, separate failure domain. A pack token that cannot be resolved
now costs exactly what it should - the pack does not load - and nothing else.
*/}}
{{- if .Values.assertionPackTokens.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.assertionPackTokens.secretName }}
  labels:
    {{- include "release-validation-framework.labels" . | nindent 4 }}
  {{- with .Values.assertionPackTokens.syncWave | default .Values.externalSecret.syncWave }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ . | quote }}
  {{- end }}
spec:
  refreshInterval: {{ .Values.assertionPackTokens.refreshInterval | default .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.assertionPackTokens.secretStoreRef.name | default .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.assertionPackTokens.secretStoreRef.kind | default .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ .Values.assertionPackTokens.secretName }}
    creationPolicy: Owner
  data:
    {{- toYaml .Values.assertionPackTokens.data | nindent 4 }}
{{- end }}
