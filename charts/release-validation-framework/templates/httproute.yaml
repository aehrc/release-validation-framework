{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "release-validation-framework.httpRouteName" . }}
  labels:
    {{- include "release-validation-framework.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ include "release-validation-framework.gatewayName" . }}
      sectionName: {{ .Values.gateway.listeners.https.name | default "websecure" }}
  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  rules:
    {{- range .Values.httpRoute.rules }}
    - matches:
        {{- toYaml .matches | nindent 8 }}
      backendRefs:
        - kind: Service
          name: {{ include "release-validation-framework.api.fullname" $ }}
          port: {{ $.Values.api.service.port }}
    {{- end }}
{{- end }}
