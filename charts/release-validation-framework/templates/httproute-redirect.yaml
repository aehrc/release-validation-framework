{{- if and .Values.httpRoute.enabled .Values.gateway.enabled (or .Values.certmanager.enabled .Values.gateway.listeners.http.enabled) }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "release-validation-framework.httpRouteName" . }}-http-redirect
  labels:
    {{- include "release-validation-framework.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ include "release-validation-framework.gatewayName" . }}
      sectionName: {{ .Values.gateway.listeners.http.name | default "public-http" }}
  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
      matches:
        - path:
            type: PathPrefix
            value: /
{{- end }}
