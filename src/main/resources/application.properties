# Which engine executes a validation.
#   mysql  - the production engine. Everything below under "DB configs" applies.
#   duckdb - no datasource, no JPA, no MySQL reachable anywhere; the assertion
#            corpus is read from the precompiled store instead of the assertion
#            tables, so none of the DB configs below are used.
# Anything that is not exactly "duckdb" is mysql, deliberately: a typo must not
# be able to start this service with its database half missing.
rvf.execution.engine=mysql

# DB configs
spring.datasource.username=root
spring.datasource.password=
spring.datasource.url=jdbc:mysql://localhost:3306/?useSSL=false&allowLoadLocalInfile=true&sessionVariables=sql_mode='STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION'
spring.sql.init.platform=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=create
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate=ERROR

# SQL Assertions to import
rvf.assertion.resource.local.path=../snomed-release-validation-assertions/
rvf.import.assertions.on-startup=true

# DuckDB engine (only read when rvf.execution.engine=duckdb)
# The precompiled assertion store published by duck/publish_store.py. It carries
# the transpiled statements AND each assertion's metadata, so in DuckDB mode it
# replaces the assertion tables entirely; groups.xml and policies.xml still come
# from rvf.assertion.resource.local.path above. Must be set to run a validation
# on this engine - left blank so that a MySQL deployment does not have to care.
rvf.duck.store=
# Where each run's DuckDB database file is created and deleted. Needs room for
# the release: DuckDB spills here, so a small /tmp is a run that dies on disk.
rvf.duck.work.directory=${java.io.tmpdir}

# DuckDB sizes its thread pool from the MACHINE and ignores the restrictions a
# container or scheduler imposes: under `taskset -c 0-1` DuckDB still reports
# threads=10 on a 10-core host while the JVM correctly reports 2. A pod with
# limits.cpu=2 on a 64-core node would therefore run 64 DuckDB threads inside a
# two-core quota and be throttled hard. Left at 0, RVF sets threads from
# Runtime.availableProcessors(), which DOES observe affinity and cgroup quotas.
# Set explicitly only to benchmark, or to deliberately oversubscribe.
rvf.duck.threads=0

# Blank keeps DuckDB's own heuristic (about 80% of visible RAM), which has the
# same blindness as the thread count: on a node far larger than this process's
# allocation it will aim too high. Set it to the pod/job memory limit less the
# JVM heap, e.g. 8GB.
rvf.duck.memory.limit=

# Drools Rules
rvf.drools.rule.directory=../snomed-drools-rules
rvf.drools.rule.repository.url=https://github.com/IHTSDO/snomed-drools-rules/blob/develop

#rvf schema parameters
rvf.master.schema.name=rvf_master
rvf.qa.result.table.name=qa_result

# Connection pool configuration (Apache Commons DBCP)
# Maximum number of active connections that can be allocated from this pool at the same time
rvf.datasource.maxActive=200
# Maximum number of milliseconds that the pool will wait for a connection to be returned
rvf.datasource.maxWait=20000
# Whether to validate connections before borrowing them from the pool
rvf.datasource.testOnBorrow=true
# Whether to validate connections while they are idle
rvf.datasource.testWhileIdle=true
# SQL query used to validate connections
rvf.datasource.validationQuery=SELECT 1
# Default transaction isolation level (2 = READ_COMMITTED)
rvf.datasource.defaultTransactionIsolation=2
# Time in milliseconds between eviction runs (default: 60000 = 60 seconds)
rvf.datasource.timeBetweenEvictionRunsMillis=60000
# Minimum time in milliseconds that a connection may sit idle in the pool before it is eligible for eviction (default: 1800000 = 30 minutes)
# This should be less than MySQL's wait_timeout to prevent stale connections
rvf.datasource.minEvictableIdleTimeMillis=1800000
# Number of connections to test per eviction run (default: 3)
rvf.datasource.numTestsPerEvictionRun=3

# RF2 filename regex patterns mapped to edition codes (regex=edition, matched in list order)
rvf.rf2-filename-edition.default-edition=INT
rvf.rf2-filename-edition.pattern-to-edition[0]=SpanishExtension.*_INT=ES
rvf.rf2-filename-edition.pattern-to-edition[1]=SimplexEdition_=SIMPLEX
rvf.rf2-filename-edition.pattern-to-edition[2]=_NL1000146_[0-9]+\\.txt=NL
