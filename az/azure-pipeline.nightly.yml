# Nightly AMT validation on the deployed DuckDB RVF, published as test results.
#
# This is the pipeline that runs ALONGSIDE def 42 `daily-rvf` and is meant to
# replace it. It does not build or run RVF itself: it hands a release to the
# deployed API and reports what comes back, so the thing under test is the
# deployment, not an agent-local jar. That is the whole difference from
# `azure-pipeline.engine-ab.yml`, which is a PR gate that runs both engines on
# the agent.
#
# TRIGGER: on the STAGE, not on the build.
#
# `trigger: true` on a pipeline resource fires only when the triggering run
# succeeds OVERALL. On 2026-08-07 build 15816 ran RvfStage to success and
# published a good report, then failed on `FileTests` - an unrelated
# release-content assertion - so a build-level trigger never fired. Triggering on
# the RvfStage stage decouples us from assertions that have nothing to do with
# whether a release exists to validate.
#
# TOLERATING A PARTIAL daily-rvf.
#
# Only a fully SUCCEEDED daily-rvf publishes `rf2-bundle` and `rvf-report`; a
# partiallySucceeded run publishes just `build-tempo`. Two of the eight nights to
# 2026-08-06 were partial, including two consecutively. So a missing bundle is a
# NORMAL outcome and must not read as a broken nightly: the run completes as
# SucceededWithIssues with a warning naming the triggering build, and every
# validation step is skipped.
#
# NOT YET VERIFIED. Nothing in this file has run, because it needs a deployed
# API and a job store share that do not exist yet. The unknowns are explicit
# parameters rather than guesses - see `Preconditions` below. Everything that
# CAN be checked without a cluster has been: the YAML parses, and the JUnit
# conversion is exercised against real RVF reports by ci/rvf_junit_selftest.py.
#
# Preconditions, all of which are deployment decisions in duck/ROADMAP.md:
#
#   1. `rvfBaseUrl` reachable from the agent pool, serving the deployed API.
#   2. A job store share the API and its workers both mount, whose coordinates
#      are `jobStoreAccount` / `jobStoreShare`. The AKS manifest currently uses a
#      DYNAMIC azurefile PVC, whose share name is generated - so either bind a
#      static share or read the generated name once and set it here. This is the
#      one precondition that cannot be inferred from the repo.
#   3. A Keycloak service-account client whose token this pipeline can obtain,
#      and whose service-account user is in the group the gateway's
#      SecurityPolicy requires. The gateway injects the `X-AUTH-*` headers RVF
#      reads from the token's claims and strips any the client sent, so this
#      pipeline sends a Bearer token and nothing else.

name: 'nightly-rvf-duck-$(Date:yyyyMMdd)$(Rev:.r)'

trigger: none
pr: none

resources:
  pipelines:
    - pipeline: dailyRvf
      # `source` is the pipeline NAME, not its id.
      source: daily-rvf
      trigger:
        stages:
          - RvfStage

parameters:
  - name: rvfBaseUrl
    displayName: 'Base URL of the deployed RVF API, through the gateway'
    type: string
    # The PUBLIC URL, deliberately, not the in-cluster Service. Going through
    # the Envoy gateway means this pipeline exercises exactly the path SI uses -
    # OIDC/JWT, header injection, body limits and all - rather than a route
    # nobody else takes. It also keeps the NetworkPolicy tight: only the gateway
    # may reach rvf-api, so an in-cluster shortcut would have to be punched
    # through it.
    default: 'https://ncts-rvf.australiaeast.cloudapp.azure.com'
  - name: keycloakIssuer
    displayName: 'Keycloak issuer (note the /auth path segment)'
    type: string
    default: 'https://auth.ontoserver.csiro.au/auth/realms/aehrc'
  - name: authClientId
    displayName: 'Service-account client used to obtain a token'
    type: string
    default: 'si-rvf-client'
  # Checked against GET /groups on the deployed server, with the assertion count
  # each one carries:
  #
  #   AustralianEdition             200   the edition being validated
  #   release-type-validation        87   needs a previous release
  #   file-centric-validation        46
  #   component-centric-validation   42
  #
  # The previous default ended in `resource`, which is not a group this server
  # has - the string had been truncated, and `resource-centric-validation` does
  # not exist here either. RVF rejects the whole submission when any named group
  # is unknown, so every run would have died on HTTP 412. Build 16220 did.
  - name: groups
    displayName: 'Assertion groups (comma separated)'
    type: string
    default: 'AustralianEdition,file-centric-validation,component-centric-validation,release-type-validation'
  - name: enableDrools
    displayName: 'Run the Drools rules'
    type: boolean
    default: true
  # Required whenever enableDrools is true. Without it the run does not skip
  # Drools - it FAILS, with "Drools validation has stopped due to error: No
  # drools rules assertion group specified", which is what happened to build
  # 16221 after fifteen minutes of validating.
  #
  # These are directories under the rule set mounted at
  # /app/snomed-drools-rules, confirmed on the running worker. common-authoring
  # holds the rules every edition shares; au-authoring holds the AU ones.
  - name: droolsRulesGroups
    displayName: 'Drools rule groups (comma separated), used when Drools is on'
    type: string
    default: 'common-authoring,au-authoring'
  - name: enableMRCM
    displayName: 'Run the MRCM validation'
    type: boolean
    default: true
  - name: previousRelease
    displayName: 'Previous release blob name, or empty for a first-time release'
    type: string
    default: ''
  - name: waitMinutes
    displayName: 'Minutes to wait for the validation to finish'
    type: number
    default: 60
  # Floors, not targets: they exist to catch a phase or a category that
  # silently did not run.
  #
  # Measured against what THIS pipeline's `groups` default actually requests,
  # which is the international set and NOT amtv4 - the AMT assertions live in a
  # private repository and reach the engine through a corpus overlay, so the
  # scheduled nightly does not ask for them. Builds 16226 and 16246 are the
  # honest reference:
  #
  #   MRCM                979
  #   SQL                 225
  #   DROOL_RULES          78
  #   ARCHIVE_STRUCTURAL    0 failures
  #   total             1,282
  #
  # The old floor of 1,000 was set against that same 1,282 and could not do its
  # job. 979 of the total is MRCM, whose count moves with the content of the
  # MRCM refsets, so a total floor has to sit low enough to tolerate that
  # variation - which is why it sat through a whole category going absent: when
  # a run DID request amtv4 and the 200 AMT assertions were missing from the
  # store, SQL ran 225 of 425 and 1,282 cleared 1,000 without a murmur. A total
  # dominated by a phase that legitimately varies cannot police a phase that
  # does not.
  #
  # Note how badly a guess would serve either number: without a previous
  # release the same groups produce 209, because the release-type assertions
  # have nothing to compare against and are simply absent from the report
  # rather than failing.
  - name: minAssertions
    displayName: 'Fail if fewer than this many assertions ran in total (guards a silently skipped phase)'
    type: number
    default: 1200
  # SQL is the deterministic part - group selection times the precompiled store
  # - so this is the floor that catches an assertion CATEGORY going absent,
  # which the total cannot. 200 sits just under the international 225.
  #
  # A run that ADDS amtv4 measures 425 SQL and 1,482 total (build 16247), so
  # queue it with minSqlAssertions=400 and minAssertions=1400: those floors are
  # then what notices the AMT overlay having vanished, and the overlay is
  # mutable state outside git, so something needs to.
  - name: minSqlAssertions
    displayName: 'Fail if fewer than this many SQL assertions ran (guards a silently absent category)'
    type: number
    default: 200

variables:
  - group: ncts-release
  # No storage account, share name or account key here any more. The release is
  # sent in the request to /run-post rather than staged into the job store, so
  # the only secret this pipeline needs is the Keycloak client secret below.
  - name: workdir
    value: '$(Agent.TempDirectory)/nightly-rvf'
  # Scope is a decided question now, not an open one: the full run with Drools
  # and MRCM measures about 780 s end to end. See duck/ROADMAP.md task 13.
  - name: runId
    value: ''

stages:
  - stage: Nightly
    displayName: 'Validate the nightly release on the deployed RVF'
    jobs:
      - job: Validate
        pool:
          name: ncts-k8s-dedicated-pool
        # The validation itself is minutes, but this job also waits on it, so the
        # timeout has to cover waitMinutes plus transfer.
        timeoutInMinutes: 120
        steps:
          - checkout: self
            fetchDepth: 1

          - task: Bash@3
            displayName: 'Show what triggered this'
            inputs:
              targetType: 'inline'
              script: |
                set -euo pipefail
                echo "triggering pipeline : $(resources.pipeline.dailyRvf.pipelineName)"
                echo "triggering build    : $(resources.pipeline.dailyRvf.runName)"
                echo "triggering run id   : $(resources.pipeline.dailyRvf.runID)"
                echo "rvf base url        : ${{ parameters.rvfBaseUrl }}"
                echo "groups              : ${{ parameters.groups }}"
                echo "drools / mrcm       : ${{ parameters.enableDrools }} / ${{ parameters.enableMRCM }}"
                mkdir -p '$(workdir)'

          # Download FIRST and decide afterwards. This used to ask whether the
          # triggering run succeeded, via $(resources.pipeline.dailyRvf.result) -
          # which is not a variable Azure DevOps defines. It never expanded, bash
          # tried to run it as a command, and the check therefore concluded "no
          # bundle" on every single run:
          #
          #   resources.pipeline.dailyRvf.result: command not found
          #   triggering run result is '$(resources.pipeline.dailyRvf.result)'
          #
          # Every night would have skipped with a warning and published nothing.
          # `.pipelineName`, `.runName`, `.pipelineID` and `.runID` are real;
          # `.result` is not.
          #
          # The artifact's presence is the better question anyway. It is what the
          # next step actually needs, it is true or false rather than inferred
          # from a status word, and it stays correct if the triggering pipeline
          # ever publishes a bundle from a partially succeeded run.
          - task: DownloadPipelineArtifact@2
            displayName: 'Download the prospective release'
            continueOnError: true
            inputs:
              buildType: 'specific'
              project: '$(System.TeamProject)'
              definition: '$(resources.pipeline.dailyRvf.pipelineID)'
              buildVersionToDownload: 'specific'
              pipelineId: '$(resources.pipeline.dailyRvf.runID)'
              artifactName: 'rf2-bundle'
              targetPath: '$(workdir)/bundle'

          - task: Bash@3
            name: bundle
            displayName: 'Check the triggering run published a release'
            inputs:
              targetType: 'inline'
              script: |
                set -euo pipefail
                POINTER="$(find '$(workdir)/bundle' -type f -name '*.txt' 2>/dev/null | head -1)"
                if [ -n "$POINTER" ]; then
                  echo "##vso[task.setvariable variable=haveBundle;isOutput=true]true"
                  echo "rf2-bundle present: $POINTER"
                else
                  echo "##vso[task.setvariable variable=haveBundle;isOutput=true]false"
                  echo "no rf2-bundle from $(resources.pipeline.dailyRvf.runName) - nothing to validate"
                  find '$(workdir)/bundle' -type f 2>/dev/null | head -10 || true
                fi

          - task: Bash@3
            displayName: 'Fetch the release named by the bundle'
            condition: and(succeeded(), eq(variables['bundle.haveBundle'], 'true'))
            env:
              SOURCE_KEY: $(azure.accountKey.ontodevelop)
            inputs:
              targetType: 'inline'
              script: |
                set -euo pipefail
                cd '$(workdir)'

                # The rf2-bundle artifact is a POINTER, not the release: one text
                # file holding one URL, about 300 bytes.
                #
                #   https://ontoserverdevelop.file.core.windows.net/si-daily-builds/
                #     <run>/output-files/SnomedCT_...AU...zip
                #
                # This step used to run `find bundle -name '*.zip'` and would have
                # failed on the first night with "contained no zip". Definition 66
                # has never run, so nobody had seen it.
                POINTER="$(find bundle -type f -name '*.txt' | head -1)"
                if [ -z "$POINTER" ]; then
                  echo "##vso[task.logissue type=error]rf2-bundle held no pointer file"
                  find bundle -type f | head -20
                  exit 1
                fi

                URL="$(tr -d ' \r\n' < "$POINTER")"
                echo "pointer: $URL"
                case "$URL" in
                  https://*.file.core.windows.net/*) ;;
                  *) echo "##vso[task.logissue type=error]not an Azure Files URL: $URL"; exit 1 ;;
                esac

                # https://<account>.file.core.windows.net/<share>/<path>
                REST="${URL#https://}"
                ACCOUNT="${REST%%.file.core.windows.net/*}"
                AFTER="${REST#*.file.core.windows.net/}"
                SHARE="${AFTER%%/*}"
                FILEPATH="${AFTER#*/}"
                NAME="$(basename "$FILEPATH")"
                echo "account=$ACCOUNT share=$SHARE path=$FILEPATH"

                # This key reads the SI daily-build share, which is a different
                # thing from the RVF job store - that needs no credential now,
                # because the release is sent to the API rather than staged.
                # `azure.accountKey.ontodevelop` already exists in ncts-release
                # for exactly this account.
                az storage file download \
                  --account-name "$ACCOUNT" --account-key "$SOURCE_KEY" \
                  --share-name "$SHARE" --path "$FILEPATH" \
                  --dest . --only-show-errors >/dev/null

                if [ ! -s "$NAME" ]; then
                  echo "##vso[task.logissue type=error]download produced no file"
                  exit 1
                fi
                echo "release: $NAME ($(du -h "$NAME" | cut -f1))"
                echo "##vso[task.setvariable variable=releasePath]$(pwd)/$NAME"
                echo "##vso[task.setvariable variable=releaseName]$NAME"

          - task: Bash@3
            displayName: 'Get an access token from Keycloak'
            condition: and(succeeded(), eq(variables['bundle.haveBundle'], 'true'))
            env:
              CLIENT_SECRET: $(rvf.si.client.secret)
            inputs:
              targetType: 'inline'
              script: |
                set -euo pipefail

                # client_credentials, because a pipeline cannot follow a login
                # redirect. The gateway's SecurityPolicy accepts this token via
                # its `jwt` provider and authorises on the `groups` claim, so the
                # service-account user for this client MUST be a member of the
                # required group or every request 403s with a valid token.
                ISSUER='${{ parameters.keycloakIssuer }}'
                HTTP="$(curl -sS -m 60 -o token.json -w '%{http_code}' \
                  -X POST "$ISSUER/protocol/openid-connect/token" \
                  -d grant_type=client_credentials \
                  -d client_id='${{ parameters.authClientId }}' \
                  --data-urlencode "client_secret=$CLIENT_SECRET")"

                if [ "$HTTP" != "200" ]; then
                  echo "##vso[task.logissue type=error]token request returned HTTP $HTTP"
                  # The body names the cause - invalid_client for a bad secret,
                  # unauthorized_client if service accounts are not enabled -
                  # and contains no token, so it is safe to print.
                  head -c 400 token.json || true
                  exit 1
                fi

                TOKEN="$(python3 -c "import json;print(json.load(open('token.json'))['access_token'])")"
                [ -n "$TOKEN" ] || { echo "##vso[task.logissue type=error]no access_token in response"; exit 1; }

                # issersecret so it never appears in a log, even if a later step
                # echoes the command it ran.
                echo "##vso[task.setvariable variable=accessToken;issecret=true]$TOKEN"

                # Expiry is worth logging: a validation can outlast a short-lived
                # token, and the poll loop would then start 401ing mid-run.
                python3 -c "
                import json
                d = json.load(open('token.json'))
                print(f\"  token acquired, expires_in {d.get('expires_in')}s\")
                "

          - task: Bash@3
            displayName: 'Decide which previous release to compare against'
            condition: and(succeeded(), eq(variables['bundle.haveBundle'], 'true'))
            env:
              ACCESS_TOKEN: $(accessToken)
            inputs:
              targetType: 'inline'
              script: |
                set -euo pipefail
                cd '$(workdir)'

                # An explicit parameter wins, so a person re-running by hand can
                # pin the comparison. Empty means "ask the server", which is the
                # nightly's normal path.
                PREV='${{ parameters.previousRelease }}'
                if [ -n "$PREV" ]; then
                  echo "previous release pinned by parameter: $PREV"
                  echo "##vso[task.setvariable variable=previousRelease]$PREV"
                  exit 0
                fi

                # The rule - same edition, newest effective time strictly before
                # this one, release status ignored - lives in RVF so that this
                # pipeline and the console cannot reach different conclusions
                # about the same pair of releases.
                HTTP="$(curl -sS -m 120 -o previous.json -w '%{http_code}' \
                  -H "Authorization: Bearer $ACCESS_TOKEN" \
                  --get --data-urlencode 'forFile=$(releaseName)' \
                  '${{ parameters.rvfBaseUrl }}/releases/previous')"

                case "$HTTP" in
                  204)
                    # Nothing suitable is kept. That is legitimate for a genuine
                    # first-time release, and a mistake the rest of the time, and
                    # the report cannot tell the difference - the assertions are
                    # simply absent. So it is a warning rather than silence.
                    echo "##vso[task.logissue type=warning]RVF holds no earlier release of this edition, so release-type assertions will not run. Keep one with the rvf-keep-release pipeline."
                    echo "##vso[task.setvariable variable=previousRelease]"
                    ;;
                  200)
                    PREV="$(python3 -c 'import json;print(json.load(open("previous.json"))["previousRelease"])')"
                    echo "resolved: $PREV"
                    echo "##vso[task.setvariable variable=previousRelease]$PREV"
                    ;;
                  *)
                    echo "##vso[task.logissue type=error]asking for the previous release returned $HTTP"
                    cut -c1-300 previous.json || true
                    exit 1
                    ;;
                esac

          - task: Bash@3
            displayName: 'Submit the validation'
            condition: and(succeeded(), eq(variables['bundle.haveBundle'], 'true'))
            env:
              ACCESS_TOKEN: $(accessToken)
            inputs:
              targetType: 'inline'
              script: |
                set -euo pipefail
                cd '$(workdir)'

                RUN_ID="$(date +%s%N | cut -c1-13)"
                STORAGE_LOCATION="nightly-$(Build.BuildId)"

                # An optional form field cannot be spliced in with a template
                # expression - it would land mid-continuation and break the
                # command - so it goes in a bash array.
                ARGS=(
                  # /run-post, not /run-post-via-s3: the release is sent in the
                  # request rather than staged into the job store first. The API
                  # writes it into the store itself, so the end state is the
                  # same, but the pipeline needs no storage account, no share
                  # name and no account key.
                  #
                  # Those three were worth removing. The share is a dynamically
                  # provisioned PVC, so AKS generates the account and share
                  # names and they change silently if it is ever re-provisioned;
                  # and the key had to be copied out of the cluster into an ADO
                  # variable because an agent cannot reach the in-cluster Vault.
                  # This is the path the console and ci/smoke_test.sh already
                  # use, so it is the exercised one.
                  -X POST '${{ parameters.rvfBaseUrl }}/run-post'
                  # A Bearer token, NOT X-AUTH-*. The gateway authenticates the
                  # JWT and injects the X-AUTH-* headers itself, stripping any
                  # the client sent - so sending them here would at best be
                  # ignored and at worst look like a spoofing attempt.
                  -H "Authorization: Bearer $ACCESS_TOKEN"
                  -F "file=@$(releasePath)"
                  -F "runId=$RUN_ID"
                  -F "storageLocation=$STORAGE_LOCATION"
                  -F 'groups=${{ parameters.groups }}'
                  -F 'enableDrools=${{ parameters.enableDrools }}'
                  # Named whenever Drools is on. RVF fails the run rather than
                  # skipping the phase if the groups are absent.
                  -F 'droolsRulesGroups=${{ parameters.droolsRulesGroups }}'
                  # NOTE the spelling: enableMRCMValidation, capital MRCM. A
                  # misspelling binds silently to the false default and produces
                  # a green report that skipped the entire phase.
                  -F 'enableMRCMValidation=${{ parameters.enableMRCM }}'
                  -F 'releaseAsAnEdition=true'
                  -F 'failureExportMax=100'
                )
                PREV='$(previousRelease)'
                if [ -n "$PREV" ]; then
                  ARGS+=( -F "previousRelease=$PREV" )
                  echo "previous release: $PREV"
                else
                  # Without one, every release-type assertion needing <PREVIOUS>
                  # is dropped as not-executed: 49 of 87 on the AU edition. The
                  # run is still green, which is why the step before this one
                  # warns rather than staying quiet about it.
                  echo "no previous release - release-type assertions will not execute"
                fi

                HTTP="$(curl -sS -m 300 -o submit.json -w '%{http_code}' "${ARGS[@]}")"

                echo "submit -> HTTP $HTTP"
                cat submit.json 2>/dev/null || true
                echo

                # 412 means an assertion group name does not exist; 400 with an
                # empty body means the prospective file was not found under the
                # job store root - both are configuration, not flakiness.
                if [ "$HTTP" != "201" ]; then
                  echo "##vso[task.logissue type=error]submit returned HTTP $HTTP - 412 is an unknown assertion group, 400 an unresolvable release path"
                  exit 1
                fi

                echo "##vso[task.setvariable variable=runId]$RUN_ID"
                echo "##vso[task.setvariable variable=storageLocation]$STORAGE_LOCATION"

          - task: Bash@3
            displayName: 'Wait for the validation to finish'
            condition: and(succeeded(), eq(variables['bundle.haveBundle'], 'true'))
            env:
              ACCESS_TOKEN: $(accessToken)
            inputs:
              targetType: 'inline'
              script: |
                set -euo pipefail
                cd '$(workdir)'

                DEADLINE=$(( $(date +%s) + ${{ parameters.waitMinutes }} * 60 ))
                STARTED=$(date +%s)
                URL='${{ parameters.rvfBaseUrl }}/result/$(runId)?storageLocation=$(storageLocation)'

                # The HTTP shape is {status, rvfValidationResult:{TestResult,...}},
                # NOT the on-disk results.json shape which has TestResult at the
                # top level; checking the wrong one polls forever against a
                # finished run.
                #
                # Observed statuses: QUEUED/RUNNING carry only a Message, a
                # COMPLETE run reports status NULL, and a FAILED run reports
                # status FAILED *with* a TestResult and an endTime. So presence
                # of a TestResult is NOT completion - a failed MRCM phase yields
                # a perfectly well-formed report holding 62 tests instead of
                # 1037, which would publish as a smaller green nightly. Status is
                # checked FIRST for exactly that reason.
                #
                # Exit codes: 0 ready, 2 failed, 1 still running. One line each -
                # an indented -c body is an IndentationError.
                CHECK="import json,sys; r=json.load(open('report.json')); d=r.get('rvfValidationResult') or {}; sys.exit(2 if r.get('status')=='FAILED' else (0 if d.get('TestResult') and d.get('endTime') else 1))"
                MSGS="import json; d=json.load(open('report.json')).get('rvfValidationResult') or {}; print('; '.join(str(m) for m in (d.get('failureMessages') or []))[:800] or 'no failureMessages')"

                while [ "$(date +%s)" -lt "$DEADLINE" ]; do
                  HTTP="$(curl -sS -m 120 -o report.json -w '%{http_code}' \
                    -H "Authorization: Bearer $ACCESS_TOKEN" "$URL" || true)"

                  if [ "$HTTP" = "200" ]; then
                    set +e
                    python3 -c "$CHECK" 2>/dev/null
                    STATE=$?
                    set -e
                    case "$STATE" in
                      0)
                        echo "report complete after $(( $(date +%s) - STARTED ))s"
                        exit 0
                        ;;
                      2)
                        echo "##vso[task.logissue type=error]RVF reported the run FAILED: $(python3 -c "$MSGS")"
                        exit 1
                        ;;
                    esac
                  fi
                  echo "  waiting, last HTTP $HTTP, $(( DEADLINE - $(date +%s) ))s left"
                  sleep 20
                done

                echo "##vso[task.logissue type=error]no report after ${{ parameters.waitMinutes }} minutes"
                exit 1

          - task: Bash@3
            displayName: 'Assert the requested scope actually ran'
            condition: and(succeeded(), eq(variables['bundle.haveBundle'], 'true'))
            inputs:
              targetType: 'inline'
              script: |
                set -euo pipefail
                cd '$(workdir)'

                # A phase that silently does not run is the failure mode this
                # nightly is least able to notice: on 2026-09-02 a misspelled
                # `enableMrcmValidation` bound to the false default and produced
                # a COMPLETE report in 94 s with 62 tests instead of 1037 - green,
                # fast, and validating almost nothing. reportSummary names each
                # phase as executed or disabled, so assert against what we asked
                # for rather than trusting the exit status.
                python3 - <<'PY'
                import json, os, sys

                report = json.load(open('report.json')).get('rvfValidationResult') or {}
                summary = report.get('reportSummary') or {}
                wanted = {
                    'DROOL_RULES': os.environ['WANT_DROOLS'] == 'True',
                    'MRCM': os.environ['WANT_MRCM'] == 'True',
                }

                problems = []
                for phase, requested in wanted.items():
                    line = str(summary.get(phase, 'absent'))
                    ran = 'executed' in line.lower()
                    print(f'  {phase:12s} requested={requested!s:5s} -> {line}')
                    if requested and not ran:
                        problems.append(f'{phase} was requested but the report says "{line}"')

                # Per testType, not just the total. The total is dominated by
                # MRCM - 979 of build 16247's 1,482 - and MRCM's count moves
                # with the content of the MRCM refsets, so a total floor has to
                # sit low enough to tolerate that. Which means it cannot see the
                # failure that actually happened: the 200 amtv4 assertions were
                # missing for weeks, SQL ran 225 instead of 425, and 1,282 total
                # cleared a floor of 1,000 without a murmur.
                #
                # SQL is the deterministic part - group selection times the
                # store - so it gets its own floor, and that is the one that
                # catches a category silently going absent.
                result = report.get('TestResult') or {}
                tests = result.get('totalTestsRun') or 0
                by_type = {}
                for bucket in ('assertionsFailed', 'assertionsWarning',
                               'assertionsPassed', 'assertionsSkipped'):
                    for a in result.get(bucket) or []:
                        by_type[a.get('testType') or 'unknown'] = \
                            by_type.get(a.get('testType') or 'unknown', 0) + 1
                print(f'  totalTestsRun {tests}')
                for name, count in sorted(by_type.items()):
                    print(f'    {name:16s} {count}')

                if tests < int(os.environ['MIN_TESTS']):
                    problems.append(f'only {tests} assertions ran, below the floor of {os.environ["MIN_TESTS"]}')
                sql = by_type.get('SQL', 0)
                if sql < int(os.environ['MIN_SQL']):
                    problems.append(
                        f'only {sql} SQL assertions ran, below the floor of '
                        f'{os.environ["MIN_SQL"]} - a whole assertion category '
                        f'can go absent without moving the total')

                for p in problems:
                    print(f'##vso[task.logissue type=error]{p}')
                sys.exit(1 if problems else 0)
                PY
            env:
              WANT_DROOLS: '${{ parameters.enableDrools }}'
              WANT_MRCM: '${{ parameters.enableMRCM }}'
              # Floors, not exact counts: the corpus grows. Set below the
              # smallest legitimate full run and above any partial one.
              MIN_TESTS: '${{ parameters.minAssertions }}'
              MIN_SQL: '${{ parameters.minSqlAssertions }}'

          - task: Bash@3
            displayName: 'Convert the report to JUnit'
            condition: and(succeeded(), eq(variables['bundle.haveBundle'], 'true'))
            inputs:
              targetType: 'inline'
              script: |
                set -euo pipefail
                cd '$(workdir)'

                # failureCount == -1 is RVF's sentinel for "never ran", so it
                # becomes <skipped> rather than a red build. Warnings likewise -
                # a nightly that goes red on a warning gets ignored within a week.
                # Percent-encoded rather than spliced: a storage location is a
                # free-text field the submitter chooses, so it can carry a
                # character that silently truncates the query string.
                CONSOLE_URL=$(RUN_ID='$(runId)' STORAGE='$(storageLocation)' BASE='${{ parameters.rvfBaseUrl }}' python3 -c "import os, urllib.parse as u; print(os.environ['BASE'].rstrip('/') + '/ui/?' + u.urlencode({'run': os.environ['RUN_ID'], 'storage': os.environ['STORAGE']}))")

                python3 '$(Build.SourcesDirectory)/ci/rvf_junit.py' report.json \
                  --out rvf-junit.xml \
                  --summary rvf-summary.md \
                  --console-url "$CONSOLE_URL" \
                  --report-url '${{ parameters.rvfBaseUrl }}/result/$(runId)?storageLocation=$(storageLocation)' \
                  --instance-limit 10

                # Azure DevOps renders an uploaded markdown file as a build
                # summary tab; GITHUB_STEP_SUMMARY does not exist here.
                echo "##vso[task.uploadsummary]$(workdir)/rvf-summary.md"
                cat rvf-summary.md

          - task: PublishTestResults@2
            displayName: 'Publish the validation as test results'
            condition: and(succeeded(), eq(variables['bundle.haveBundle'], 'true'))
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '$(workdir)/rvf-junit.xml'
              testRunTitle: 'RVF nightly $(Build.BuildNumber)'
              # The report is the record even when assertions fail; a failed
              # publish step would hide it.
              failTaskOnFailedTests: false

          - task: PublishPipelineArtifact@1
            displayName: 'Publish the report and the summary'
            condition: and(succeeded(), eq(variables['bundle.haveBundle'], 'true'))
            inputs:
              targetPath: '$(workdir)'
              artifact: 'rvf-nightly-$(Build.BuildId)'

          # A partial daily-rvf is not our failure, but it must be visible -
          # otherwise a week of skipped nightlies reads as a week of green ones.
          - task: Bash@3
            displayName: 'Flag a skipped night'
            condition: ne(variables['bundle.haveBundle'], 'true')
            inputs:
              targetType: 'inline'
              script: |
                set -euo pipefail
                echo "##vso[task.logissue type=warning]No release to validate: daily-rvf run $(resources.pipeline.dailyRvf.runName) published no rf2-bundle artifact."
                echo "##vso[task.complete result=SucceededWithIssues;]"
