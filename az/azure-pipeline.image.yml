# Build and PUSH the RVF server image to ACR.
#
# WHY THIS IS A SEPARATE PIPELINE
#
# Two other places build an image and neither publishes this one:
#
#   * `azure-pipeline.engine-ab.yml` runs `jib:buildTar` and attaches the
#     tarball as a pipeline artifact. That is deliberate - it is a PR gate, and
#     a gate that pushes to a shared registry on every pull request is a way to
#     get a broken `latest`.
#   * ADO definition 63 `rvf-duck-image` DOES push, but it builds the **Python**
#     DuckDB engine from `aehrc/rvf@rvf-duck` - a different codebase - and it
#     pushes `aehrc-rvf/rvf-duck`. This image is the Java RVF server, so it is
#     `aehrc-rvf/release-validation-framework` with the engine in the TAG. Sharing a repository name between two unrelated
#     artefacts is how a cluster ends up running the wrong one.
#
# NOT VERIFIED. Written 2026-09-03 on a host with no `az`, no Docker and no
# registry credentials, so it has never run. What was checked: the YAML parses,
# every inline script passes `bash -n`, and the build it invokes produces a
# 480MB amd64 image whose tags come out as this file claims.
#
# The pinned forks are the part most likely to surprise a fresh agent - see the
# first real step.

name: 'rvf-image-$(Build.SourceBranchName)-$(Date:yyyyMMdd)$(Rev:.r)'

# Build on anything that changes what is INSIDE the image.
#
# This was `trigger: none` when nothing consumed the image and a push was a
# deliberate act. That is no longer true: the cluster runs this image, and
# ArgoCD Image Updater watches the repository for new tags, so a commit that
# never becomes an image is a commit that never reaches the cluster. Three
# changes to src/ sat unbuilt before this was noticed.
#
# The path filter is the point. A chart-only or documentation-only commit must
# not spend ~9 minutes rebuilding an identical image, and the chart has its own
# pipeline. Note `exclude` wins over `include` in ADO, so charts/ and k8s/ are
# listed even though they are outside the includes.
trigger:
  branches:
    include:
      - main
      - catchup-upgraded
  # Prefix matches, NOT globs. Azure DevOps path filters compare path prefixes;
  # they do not accept wildcards. `src/**` therefore matched nothing, which is
  # why commit e915f7fd - a change under src/ and nothing else - did not build,
  # while ec8f8052 and 6db5b0cf did: those touched this file, which was listed
  # as an exact path and so matched as a prefix of itself.
  #
  # No `exclude` list is needed. The includes are specific paths, so anything
  # outside them - charts/, k8s/, ci/, the markdown at the root - already fails
  # to match and cannot start a build.
  paths:
    include:
      - src
      - pom.xml
      - checkout-resources.sh
      - duck/build-pinned-forks.sh
      - duck/maven-settings.xml
      - az/azure-pipeline.image.yml

# Still never on a pull request: a PR must not push to a shared registry.
pr: none

parameters:
  - name: imageRepository
    displayName: 'Repository within nctsacr for the DuckDB RVF server image'
    type: string
    default: 'aehrc-rvf/release-validation-framework'
  - name: engineSuffix
    displayName: 'Tag suffix naming the engine, so this cannot be mistaken for a MySQL build'
    type: string
    default: 'duckdb'
  - name: deployBranch
    displayName: 'The one branch whose tags ArgoCD Image Updater may deploy'
    type: string
    default: 'catchup-upgraded'
  - name: alsoTagLatest
    displayName: 'Also move the bare engine tag (e.g. :duckdb) to this build'
    type: boolean
    default: false
  - name: runTests
    displayName: 'Run the test suite before pushing'
    type: boolean
    default: true

variables:
  - group: ncts-release
  # Kept for anything that reads MAVEN_OPTS, but every mvn call below ALSO
  # passes -Dmaven.repo.local explicitly. Relying on this variable alone put the
  # three forks in $(Pipeline.Workspace)/.m2 while the RVF build resolved against
  # the agent's default ~/.m2 and reported all four artefacts missing.
  - name: MAVEN_OPTS
    value: '-Dmaven.repo.local=$(Pipeline.Workspace)/.m2'
  # `ncts-acr` is the dockerregistry service connection for nctsacr.azurecr.io.
  # Its login writes ~/.docker/config.json, which jib reads directly - so this
  # needs no Docker daemon.
  #
  # This was ontoserver.azurecr.io, which is where every RVF image had always
  # gone. Two things make nctsacr the right home now.
  #
  # The cluster that runs this image is in the NCTS subscription and its
  # tooling is authenticated to nctsacr, not to ontoserver. ArgoCD Image
  # Updater proved it: its registries.conf declares nctsacr alone, so it read
  # ontoserver anonymously and logged `unauthorized` on every cycle, considering
  # the image and updating nothing. Moving the image needs no new
  # cross-subscription credential to hold and rotate.
  #
  # And the ontoserver repository is shared with MySQL-engine builds of RVF,
  # which is why the engine has to be in the tag at all. Its own repository
  # here holds these builds and nothing else.
  #
  # The chart already publishes to nctsacr.azurecr.io/helm, so the image and
  # the chart that deploys it now live in one registry.
  - name: registryConnection
    value: 'ncts-acr'
  - name: registryHost
    value: 'nctsacr.azurecr.io'

stages:
  - stage: Image
    displayName: 'Build and push the RVF server image'
    jobs:
      - job: Push
        # HOSTED, not ncts-k8s-dedicated-pool. Build 16149 failed on the
        # self-hosted pool with:
        #
        #   Non-resolvable parent POM for org.ihtsdo.drools:snomed-drools:
        #   Cannot access ihtsdo-releases (https://nexus3.ihtsdotools.org/...)
        #
        # That agent reaches Maven Central fine - it fetched plexus artifacts in
        # the same step - but not SI's Nexus, and `org.snomed:snomed-parent-bom`
        # is ONLY there: Central 404s it. Every SI parent POM this project and
        # its three forks inherit from has the same problem, so nothing Java
        # builds on that pool without an egress change.
        #
        # This job needs internet and ACR, not the cluster, so a hosted agent
        # sidesteps the whole question. Every other Maven pipeline in this
        # project already uses the hosted queue.
        pool:
          vmImage: ubuntu-latest
        timeoutInMinutes: 90
        steps:
          - checkout: self
            # The version and the forks come from the tree, and the commit is
            # baked in as a tag, so a shallow checkout is fine.
            fetchDepth: 1

          - task: Bash@3
            displayName: 'Install JDK 25'
            inputs:
              targetType: 'inline'
              script: |
                set -euo pipefail
                # Hosted images ship 8/11/17/21, and the parent BOM sets
                # java.version=25, so the toolchain has to come down explicitly.
                # Adoptium's API resolves the current GA build for a feature
                # version, which avoids pinning a patch that later disappears.
                URL='https://api.adoptium.net/v3/binary/latest/25/ga/linux/x64/jdk/hotspot/normal/eclipse'
                curl -fsSL -o /tmp/jdk25.tar.gz "$URL"
                sudo mkdir -p /opt/jdk25
                sudo tar -xzf /tmp/jdk25.tar.gz -C /opt/jdk25 --strip-components=1
                echo "##vso[task.setvariable variable=JAVA_HOME]/opt/jdk25"
                echo "##vso[task.prependpath]/opt/jdk25/bin"
                /opt/jdk25/bin/java -version

          - task: Bash@3
            name: coords
            displayName: 'Resolve the version from the pom'
            inputs:
              targetType: 'inline'
              script: |
                set -euo pipefail
                VERSION="$(python3 - <<'PY'
                import xml.etree.ElementTree as ET
                # The project version sits BEFORE <parent> in this pom, and the
                # first <version> after </parent> is a property (1.5.5.1), so
                # any text-splitting heuristic reads the wrong number and pushes
                # a tag no manifest references. Ask the XML.
                ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
                root = ET.parse('pom.xml').getroot()
                version = root.find('m:version', ns)
                if version is None or not (version.text or '').strip():
                    raise SystemExit('FATAL: no project <version> in pom.xml')
                print(version.text.strip())
                PY
                )"
                SHA="$(git rev-parse --short=12 HEAD)"
                echo "version : $VERSION"
                echo "commit  : $SHA"
                echo "##vso[task.setvariable variable=version;isOutput=true]$VERSION"
                echo "##vso[task.setvariable variable=sha;isOutput=true]$SHA"

          - task: Bash@3
            displayName: 'Build the three pinned forks'
            inputs:
              targetType: 'inline'
              script: |
                set -euo pipefail
                # The pom pins three libraries to -aehrc-perf versions that
                # exist in NO remote repository: they are built from IHTSDO
                # sources plus the patches in duck/. Without this the very first
                # dependency resolution fails, and it fails for a reason nobody
                # guesses from the message.
                MAVEN_REPO_LOCAL="$(Pipeline.Workspace)/.m2" \
                FORKS_BUILD_DIR="$(Agent.TempDirectory)/forks" \
                  ./duck/build-pinned-forks.sh

          - task: Bash@3
            displayName: 'Build and test'
            condition: eq('${{ parameters.runTests }}', true)
            inputs:
              targetType: 'inline'
              script: |
                set -euo pipefail
                # AWS_REGION is needed even to START: DroolsRulesValidationService
                # builds an S3 client in @PostConstruct and the SDK refuses one
                # without a region.
                export AWS_REGION=us-east-1 AWS_DEFAULT_REGION=us-east-1
                mvn -B -ntp -s "$(Build.SourcesDirectory)/duck/maven-settings.xml" -Dmaven.repo.local=$(Pipeline.Workspace)/.m2 -Ddependency-check.skip=true verify

          - task: Bash@3
            displayName: 'Package'
            condition: ne('${{ parameters.runTests }}', true)
            inputs:
              targetType: 'inline'
              script: |
                set -euo pipefail
                mvn -B -ntp -s "$(Build.SourcesDirectory)/duck/maven-settings.xml" -Dmaven.repo.local=$(Pipeline.Workspace)/.m2 -Ddependency-check.skip=true package -DskipTests

          - task: Docker@2
            displayName: 'Log in to ACR'
            inputs:
              command: login
              containerRegistry: '$(registryConnection)'

          - task: Bash@3
            displayName: 'Push the image'
            inputs:
              targetType: 'inline'
              script: |
                set -euo pipefail

                VERSION='$(coords.version)'
                SHA='$(coords.sha)'
                BUILD_ID='$(Build.BuildId)'
                SUFFIX='${{ parameters.engineSuffix }}'
                IMAGE='$(registryHost)/${{ parameters.imageRepository }}'

                # This repository ALSO holds MySQL-engine builds of RVF, so the
                # engine goes in the tag. A bare 9.0.1 here would be ambiguous
                # at best and would shadow an existing build at worst - never
                # push one.
                #
                # The engine alone is not enough, because the branch is not in
                # the tag either. ArgoCD Image Updater selects by a regular
                # expression over tag names, so if every branch produced
                # `9.0.1-duckdb-<id>-<sha>` then a build of ANY branch would be
                # a candidate for deployment - including one that does not have
                # the console, the auth fix, or anything else assumed present.
                # Nothing in the tag would say which tree it came from.
                #
                # So only the deploy branch produces the plain, selectable
                # shape. Every other branch carries its name in the tag, which
                # makes it unmatchable by that expression and self-describing to
                # a human reading `docker images`.
                BRANCH='$(Build.SourceBranchName)'
                DEPLOY_BRANCH='${{ parameters.deployBranch }}'

                if [ "$BRANCH" = "$DEPLOY_BRANCH" ]; then
                  PRIMARY="$VERSION-$SUFFIX"
                  QUALIFIER=""
                else
                  # Lower-cased, and anything not a tag character folded to '-',
                  # because branch names may hold '/' and '_'. Leading digits
                  # cannot occur here, so the expression above stays unmatchable.
                  SLUG=$(printf %s "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]\+/-/g; s/^-//; s/-$//')
                  PRIMARY="$VERSION-$SUFFIX-$SLUG"
                  QUALIFIER="$SLUG-"
                  echo "NOTE: '$BRANCH' is not the deploy branch '$DEPLOY_BRANCH'."
                  echo "      Tags carry '$SLUG' and will NOT be deployed automatically."
                fi

                # Immutable companion: build id then commit. The build id always
                # increases, so a name-ordered strategy resolves to the newest
                # build; the commit gives the tree without a lookup.
                IMMUTABLE="$PRIMARY-$BUILD_ID-$SHA"
                TAGS="$IMMUTABLE,$VERSION-$SUFFIX-$QUALIFIER$BUILD_ID"
                if [ '${{ parameters.alsoTagLatest }}' = 'True' ] && [ "$BRANCH" = "$DEPLOY_BRANCH" ]; then
                  # Deliberately NOT `latest`: that would claim to be the
                  # canonical RVF for a repository shared with MySQL builds.
                  TAGS="$TAGS,$SUFFIX"
                fi
                echo "pushing $IMAGE:$PRIMARY"
                echo "    and $IMAGE:$TAGS" | tr ',' '\n' | sed 's/^/         /'

                # amd64 only: the pom declares arm64 for local Macs, and building
                # both doubles push time for a platform no node runs.
                #
                # jib pushes registry layers itself and reads the credentials
                # Docker@2 just wrote, so no daemon is involved.
                # Labels carry the provenance the tag no longer states: which
                # commit, which build, which branch. `docker inspect` or
                # `az acr manifest show-metadata` then answers "what is running"
                # without anyone having to keep a tag-to-commit mapping.
                mvn -B -ntp -s "$(Build.SourcesDirectory)/duck/maven-settings.xml" -Dmaven.repo.local=$(Pipeline.Workspace)/.m2 -Ddependency-check.skip=true jib:build -DskipTests \
                    -Djib.from.platforms=linux/amd64 \
                    -Djib.to.image="$IMAGE:$PRIMARY" \
                    -Djib.to.tags="$TAGS" \
                    -Djib.container.labels="org.opencontainers.image.revision=$SHA,org.opencontainers.image.version=$VERSION,org.opencontainers.image.source=https://github.com/aehrc/release-validation-framework,au.csiro.rvf.engine=$SUFFIX,au.csiro.rvf.build-id=$BUILD_ID,au.csiro.rvf.branch=$(Build.SourceBranchName)"

                echo "##vso[task.setvariable variable=pushedImage]$IMAGE:$PRIMARY"
                echo "##vso[task.setvariable variable=pushedImmutable]$IMAGE:$IMMUTABLE"
                # The bare tag too: that is what `helm --set image.tag=` and the
                # chart's `image.tag` value want, without the registry and repo.
                echo "##vso[task.setvariable variable=pushedImmutableTag]$IMMUTABLE"
                echo "##vso[task.setvariable variable=buildTag]$IMMUTABLE"
                # The build-id-only tag, which ArgoCD Image Updater sorts on.
                echo "##vso[task.setvariable variable=pushedSortable]$IMAGE:$PRIMARY-$BUILD_ID"
          - task: Bash@3
            displayName: 'State what to deploy'
            inputs:
              targetType: 'inline'
              script: |
                set -euo pipefail
                IMAGE='$(registryHost)/${{ parameters.imageRepository }}'
                mkdir -p '$(Build.ArtifactStagingDirectory)'
                cat > '$(Build.ArtifactStagingDirectory)/image.md' <<EOF
                ## RVF server image pushed

                | | |
                |---|---|
                | moving tag | \`$(pushedImage)\` |
                | immutable tag | \`$(pushedImmutable)\` |
                | sortable tag | \`$(pushedSortable)\` |
                | commit | \`$(coords.sha)\` |
                | branch | \`$(Build.SourceBranchName)\` |

                The chart in \`charts/release-validation-framework\` defaults
                \`image.tag\` to its \`appVersion\`, which is the moving tag. Pin the
                immutable one to deploy exactly this build:

                \`\`\`
                helm upgrade --install rvf charts/release-validation-framework \\
                    -n rvf --create-namespace \\
                    --set image.tag=$(pushedImmutableTag)
                \`\`\`

                Or, under ArgoCD, set that value in the Application and let it sync.

                The image also carries its provenance as OCI labels, so what is
                deployed stays traceable without a tag-to-commit mapping:
                \`org.opencontainers.image.revision\` (the commit),
                \`.version\`, \`.source\`, and \`au.csiro.rvf.{engine,build-id,branch}\`.
                Read them with \`docker inspect\` or \`crane config\`.
                EOF
                echo "##vso[task.uploadsummary]$(Build.ArtifactStagingDirectory)/image.md"
                cat '$(Build.ArtifactStagingDirectory)/image.md'
