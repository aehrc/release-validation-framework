# Engine A/B: one release, both execution engines, gated on the difference.
#
# This is the check that has to pass before a change to the DuckDB engine is
# believable. It runs the SAME jar twice with only rvf.execution.engine
# differing, against one MySQL and one release, and fails on any divergence not
# accounted for in ci/known-engine-divergences.json.
#
# Why not the existing duckdb-rvf pipeline: that one compares a separate Python
# engine against a production daily-rvf report - different corpus, different
# host, different release. Useful, but a divergence there has several possible
# causes. Here the only variable is the engine.
#
# All the logic lives in ci/engine_ab_stack.sh and ci/engine_ab.py so it is the
# same code a developer runs locally. This file supplies inputs and publishes
# results; it deliberately contains no comparison logic of its own.
#
# NOTE: MySQL is the official generic Linux tarball run unprivileged, not a
# service container, so this needs no Docker daemon and no sudo on the agent.

name: 'engine-ab-$(Date:yyyyMMdd)$(Rev:.r)'

trigger: none
pr:
  branches:
    include:
      - catchup-upgraded
      - upstream/*

schedules:
  # WEEKLY, not nightly. The differential arm is the expensive proof - the MySQL
  # leg took 4020s against the AU edition with the AMT corpus today, against
  # DuckDB's 120s - and it answers a question that changes only when the
  # transpiler or the corpus does. Parity re-proven every week is worth far more
  # than parity proven once, and cheap enough at that cadence to keep.
  #
  # Sunday 14:00 UTC is Monday 00:00 in Sydney: off the nightly's path entirely,
  # so the two never contend for the dedicated pool or the release container.
  - cron: '0 14 * * 0'
    displayName: 'Weekly, off the nightly path'
    branches:
      include:
        - catchup-upgraded
    # Runs whether or not anything changed: the point is to catch a divergence
    # that appears without a commit here - a MySQL upgrade, a corpus repin, a
    # release whose content exercises a path no earlier release did.
    always: true

parameters:
  - name: release
    displayName: 'Release to validate: a path within the share, or empty for the newest AU edition'
    # Empty by default so the weekly run needs no maintenance. A named path is
    # what makes a run reproducible, so a manual queue should give one.
    type: string
    default: ''
  - name: releaseShare
    displayName: 'Azure Files share holding the SI daily builds'
    # A parameter because the layout is SI's rather than ours: the nightly reads
    # a pointer file naming
    # https://ontoserverdevelop.file.core.windows.net/si-daily-builds/<run>/output-files/<zip>
    type: string
    default: 'si-daily-builds'
  - name: previousRelease
    displayName: 'Previous release path within previousShare, or empty to resolve the newest published edition before this one'
    type: string
    default: ''
  - name: previousShare
    displayName: 'Azure Files share holding the PUBLISHED editions'
    # A different share from the daily builds on purpose. A build under test is
    # compared against the last PUBLISHED edition, because a daily build's delta
    # is cumulative from that publication - so yesterday's build shares no delta
    # boundary with today's and would fail the derivation assertions on correct
    # content. This is the layout azure-pipeline.keep-release.yml already reads.
    type: string
    default: 'snomed-versioned-content'
  - name: previousDirectory
    displayName: 'Directory of dated editions within previousShare'
    type: string
    default: 'prod/AU_32506021000036107'
  - name: groups
    displayName: 'Assertion groups'
    type: string
    default: 'release-type-validation file-centric-validation'
  - name: mysqlVersion
    displayName: 'MySQL tarball version'
    type: string
    default: '8.4.6'

variables:
  - group: ncts-release
  - name: storageAccount
    value: '$(azure.sibuilds.storage.account.name)'
  - name: storageKey
    value: '$(azure.accountKey.ontodevelop)'
  - name: workdir
    value: '$(Agent.TempDirectory)/engine-ab'
  - name: MAVEN_OPTS
    value: '-Dmaven.repo.local=$(Pipeline.Workspace)/.m2'

stages:
  - stage: EngineAB
    displayName: 'MySQL vs DuckDB, one release'
    jobs:
      - job: Compare
        pool:
          name: ncts-k8s-dedicated-pool
        # The MySQL leg loads whole editions and is the long pole: about 20
        # minutes for one edition and appreciably more with a previous release.
        timeoutInMinutes: 180
        steps:
          - checkout: self
            fetchDepth: 1

          - template: steps-jdk25.yml

          - task: Bash@3
            displayName: 'Preflight: disk and memory this run needs'
            # BEFORE anything downloads. Today's run filled the disk mid-load
            # and MySQL reported it as "Disk is full writing
            # ...owlexpressionrefset_f.MYI" followed by a dead server and a log
            # that simply stops - which reads like a corrupt download, not a
            # full disk. Two stale scratch directories were enough to do it.
            #
            # Measured, not guessed: the MySQL leg writes ~25GB of MyISAM tables
            # and indexes for one AU edition, the release unzips to ~5GB, and
            # DuckDB's scratch is ~1.6GB per materialised edition plus spill.
            inputs:
              targetType: 'inline'
              script: |
                set -euo pipefail
                NEED_GB=40
                FREE_GB="$(df -BG --output=avail "$(dirname "$(workdir)")" | tail -1 | tr -dc '0-9')"
                MEM_GB="$(free -g | awk 'NR==2 {print $7}')"
                echo "free disk : ${FREE_GB}GB (need ${NEED_GB}GB)"
                echo "available memory : ${MEM_GB}GB (two 3GB JVMs plus MySQL's 4GB pool)"
                if [ "$FREE_GB" -lt "$NEED_GB" ]; then
                  echo "##vso[task.logissue type=error]only ${FREE_GB}GB free, and the MySQL leg needs about ${NEED_GB}GB"
                  echo "Stale scratch from an earlier run is the usual cause. Clear"
                  echo "$(workdir) and any tmp-mysql/tmp-duck directories beside it."
                  exit 1
                fi
                # Not fatal: the kernel killed a leg at 22GB with two 6g JVMs, so
                # this is worth saying loudly and not worth blocking on, since
                # the heaps are parameters.
                if [ "$MEM_GB" -lt 12 ]; then
                  echo "##vso[task.logissue type=warning]${MEM_GB}GB available - a 22GB host with 6g heaps had the MySQL leg OOM-killed mid-load"
                fi

          - task: Bash@3
            displayName: 'Show what is being compared'
            inputs:
              targetType: 'inline'
              script: |
                set -euo pipefail
                echo "release          : ${{ parameters.release }}"
                echo "previous release : ${{ parameters.previousRelease }}"
                echo "groups           : ${{ parameters.groups }}"
                echo "commit           : $(Build.SourceVersion)"
                java -version 2>&1 | head -2

          - task: Bash@3
            displayName: 'Build the pinned forks'
            # Build 16302 died here, 16 minutes in, with "Could not find
            # artifact org.ihtsdo.drools:snomed-drools-engine:jar:6.1.3-aehrc-perf
            # in ihtsdo-releases". The pom pins four libraries to -aehrc-perf
            # versions that exist in NO remote repository - they are built from
            # IHTSDO sources plus the patches in duck/ - so a fresh agent cannot
            # resolve them and the message names a repository rather than the
            # cause. The image pipeline has always done this; this one was
            # written against a host whose .m2 already held them.
            inputs:
              targetType: 'inline'
              script: |
                set -euo pipefail
                MAVEN_REPO_LOCAL="$(Pipeline.Workspace)/.m2" \
                FORKS_BUILD_DIR="$(Agent.TempDirectory)/forks" \
                  ./duck/build-pinned-forks.sh

          - task: Bash@3
            displayName: 'Build the jar'
            inputs:
              targetType: 'inline'
              script: |
                set -euo pipefail
                # The same settings and local repository as the fork build, or
                # the forks it just installed are invisible to this step.
                mvn -B -ntp -s duck/maven-settings.xml \
                  -Dmaven.repo.local=$(Pipeline.Workspace)/.m2 \
                  package -DskipTests -Ddependency-check.skip=true
                ls -la target/release-validation-framework-*.jar

          - template: steps-mysql-tarball.yml
            parameters:
              mysqlVersion: '${{ parameters.mysqlVersion }}'
              workdir: $(workdir)

          - task: Bash@3
            displayName: 'Fetch the release and its previous release'
            env:
              SOURCE_KEY: $(azure.accountKey.ontodevelop)
            inputs:
              targetType: 'inline'
              script: |
                set -euo pipefail
                # Build 16312: azcopy answered NoAuthenticationInformation, and
                # the account it was asking has no `releases` CONTAINER at all.
                # The step appended an ACCOUNT KEY to a URL as though it were a
                # SAS, against a blob layout nobody had checked.
                #
                # The nightly has been downloading releases from the SI daily
                # build FILE SHARE with this same key for weeks, so this now
                # does what already works: az storage, account key, file share.
                mkdir -p shared-jobs/releases store/previous
                SHARE='${{ parameters.releaseShare }}'

                # Two shares are in play - the daily builds under test, and the
                # published editions to compare against - so the share is an
                # argument rather than a global. Both open with the same key.
                fetch_on() {   # <share> <path-in-share> <destination-dir>
                  az storage file download \
                    --account-name '$(storageAccount)' --account-key "$SOURCE_KEY" \
                    --share-name "$1" --path "$2" --dest "$3" \
                    --only-show-errors >/dev/null
                }
                fetch() { fetch_on "$SHARE" "$1" "$2"; }

                # `az storage file list` on this CLI has no --recursive (build
                # 16313: "unrecognized arguments: --recursive"), and the layout
                # is two levels - <run>/output-files/<zip> - so it is walked
                # explicitly. Every listing is printed: when this picks the
                # wrong thing, or nothing, the log has to show what it saw.
                ls_share_on() {   # <share> [path]
                  az storage file list \
                    --account-name '$(storageAccount)' --account-key "$SOURCE_KEY" \
                    --share-name "$1" ${2:+--path "$2"} --only-show-errors \
                    --query '[].{n:name,t:type}' -o tsv
                }
                ls_share() { ls_share_on "$SHARE" ${1:+"$1"}; }

                REL='${{ parameters.release }}'
                if [ -z "$REL" ]; then
                  # 684 directories on this share (build 16314). Most are named
                  # by timestamp - 2024-05-15T005507 - and a handful are GUIDs,
                  # which sort AFTER the timestamps and are what a plain
                  # `sort | tail -1` picked: a GUID directory with no
                  # output-files, so the run died on ResourceNotFound.
                  #
                  # Only the timestamp shape is considered, and for that shape a
                  # name sort IS chronological.
                  RUNS="$(ls_share | awk -F'\t' '$2 == "dir" {print $1}' \
                          | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{6}$' | sort)"
                  [ -n "$RUNS" ] || { echo "##vso[task.logissue type=error]$SHARE has no timestamp-named run directories"; exit 1; }
                  echo "--- $(echo "$RUNS" | wc -l) run directories, newest last ---"
                  echo "$RUNS" | tail -5 | sed 's/^/    /'

                  # Newest first, and more than one, because the newest build is
                  # not necessarily an AU edition - and a weekly parity run
                  # wants the newest AU one rather than nothing.
                  for RUN in $(echo "$RUNS" | tail -12 | tac); do
                    for SUB in "$RUN/output-files" "$RUN"; do
                      CAND="$(ls_share "$SUB" 2>/dev/null | awk -F'\t' '{print $1}' \
                              | grep -iE '\.zip$' | grep -iE 'AU' | sort | tail -1)"
                      if [ -n "$CAND" ]; then REL="$SUB/$CAND"; break 2; fi
                    done
                    echo "  $RUN holds no AU zip"
                  done
                  [ -n "$REL" ] || { echo "##vso[task.logissue type=error]none of the newest 12 runs holds an AU edition zip"; exit 1; }
                  # The zip name carries its effective time -
                  # SnomedCT_..._20260831.zip - so a name sort within a run is
                  # also chronological.
                  echo "no release given; using $REL"
                fi
                fetch "$REL" shared-jobs/releases

                # THE PREVIOUS RELEASE IS NOT OPTIONAL FOR A PARITY RUN.
                #
                # Build 16325 ran without one and reported 99/149 identical
                # (66.4%) with 49 unexplained divergences - and every single one
                # was the same shape: `rvf=<n> duck=-1`, a release-type assertion
                # naming <PREVIOUS>. DuckDB skips those statements and says
                # not-run; MySQL substitutes an empty schema and answers anyway,
                # which is how one assertion returned 7,015,456 findings (a row
                # per language refset member) and others returned a false 0.
                #
                # So an absent previous release does not cost coverage, it
                # INVENTS a disagreement on a third of the corpus. There is
                # nothing to baseline here and nothing to measure: resolve one or
                # fail.
                PREV='${{ parameters.previousRelease }}'
                PREV_SHARE='${{ parameters.previousShare }}'
                PREV_DIR='${{ parameters.previousDirectory }}'
                if [ -z "$PREV" ]; then
                  # A daily build's previous release is the last PUBLISHED
                  # edition, NOT yesterday's build. A daily build's delta is
                  # cumulative from the last publication, so comparing two builds
                  # lines up no deltas at all and would fail the derivation
                  # assertions for a release that is perfectly correct - a
                  # comparison worse than none, because it looks like evidence.
                  #
                  # Published editions live on a different share in dated
                  # directories - the layout azure-pipeline.keep-release.yml has
                  # been fetching from - so this walks that, not si-daily-builds.
                  REL_DATE="$(basename "$REL" | grep -oE '[0-9]{8}' | tail -1)"
                  [ -n "$REL_DATE" ] || { echo "##vso[task.logissue type=error]cannot read an effective date out of $(basename "$REL"), so cannot choose a previous release"; exit 1; }
                  echo "--- published editions under $PREV_SHARE/$PREV_DIR ---"
                  PREV_DIRS="$(ls_share_on "$PREV_SHARE" "$PREV_DIR" \
                               | awk -F'\t' '$2 == "dir" {print $1}' \
                               | grep -E '^[0-9]{8}$' | sort)"
                  echo "$PREV_DIRS" | tail -6 | sed 's/^/    /'
                  # Strictly before: an edition published the same day as the
                  # build under test is the same content, and would agree with
                  # itself for the wrong reason.
                  PREV_DATE="$(echo "$PREV_DIRS" | awk -v d="$REL_DATE" '$1 < d' | tail -1)"
                  [ -n "$PREV_DATE" ] || { echo "##vso[task.logissue type=error]no published edition under $PREV_DIR predates $REL_DATE, so the release-type assertions cannot be compared. Pin one with the previousRelease parameter."; exit 1; }
                  PREV_ZIP="$(ls_share_on "$PREV_SHARE" "$PREV_DIR/$PREV_DATE" \
                              | awk -F'\t' '$2 != "dir" {print $1}' \
                              | grep -iE '\.zip$' | sort | tail -1)"
                  [ -n "$PREV_ZIP" ] || { echo "##vso[task.logissue type=error]$PREV_DIR/$PREV_DATE holds no zip"; exit 1; }
                  PREV="$PREV_DIR/$PREV_DATE/$PREV_ZIP"
                  echo "no previous release given; using $PREV (release is $REL_DATE)"
                fi
                # The previous release goes in the RELEASE store, not the job
                # store: that is what previousRelease resolves against, in both
                # engines.
                fetch_on "$PREV_SHARE" "$PREV" store/previous
                echo "##vso[task.setvariable variable=releaseName]$(basename "$REL")"
                echo "##vso[task.setvariable variable=previousReleaseName]$(basename "$PREV")"
                ls -la shared-jobs/releases store/previous

          - task: Bash@3
            displayName: 'Selftest the comparison logic'
            inputs:
              targetType: 'inline'
              script: |
                set -euo pipefail
                # Before spending 40 minutes on two engines, check that the
                # thing which JUDGES them can tell evidence from silence. The
                # gate compares failureCount, and zero equals zero, so an
                # assertion that never ran agrees with one that ran and found
                # nothing - which is how 200 amtv4 assertions sat in a green
                # report for weeks.
                python3 ci/compare_reports_selftest.py
                python3 ci/rvf_junit_selftest.py

          - task: Bash@3
            displayName: 'Run the A/B and gate'
            inputs:
              targetType: 'inline'
              script: |
                set -euo pipefail
                export WORK="$(workdir)"
                export MYSQL_HOME="$(workdir)/mysql8"
                export JAR=$(ls target/release-validation-framework-*.jar | head -1)
                # The shim the install step built. Without it mysqld starts
                # here exactly as it failed there - "error while loading shared
                # libraries" - and the stack script's own wait would report it
                # as "mysql engine did not come up", which names the symptom
                # two steps from the cause.
                export LD_LIBRARY_PATH="$(mysqlLibs)${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
                # The name the fetch step resolved, not the parameter: with the
                # parameter empty it picked the newest itself, and the stack
                # script needs the file that is actually on disk.
                ARGS=(--release "releases/$(releaseName)" --groups '${{ parameters.groups }}')
                # Same reason for the previous release, which the fetch step now
                # always resolves: it failed the run rather than leave this empty,
                # because build 16325 proved an absent previous release does not
                # reduce coverage, it manufactures 49 divergences.
                ARGS+=(--previous "$(previousReleaseName)")
                ci/engine_ab_stack.sh "${ARGS[@]}"


          - task: Bash@3
            displayName: 'Build the container image (jib, no daemon)'
            inputs:
              targetType: 'inline'
              script: |
                set -euo pipefail
                # jib needs no Docker daemon, which is why this works on the
                # k8s agent pool. buildTar keeps the image local; publishing is
                # a separate, deliberate step.
                # Same settings and local repository as the jar build, for the
                # same reason: without them the parent POM and the -aehrc-perf
                # forks are unresolvable on a fresh agent.
                mvn -B -ntp -s duck/maven-settings.xml \
                    -Dmaven.repo.local=$(Pipeline.Workspace)/.m2 \
                    jib:buildTar -DskipTests -Ddependency-check.skip=true \
                    -Djib.from.platforms=linux/amd64 \
                    -Ddocker.registry=ontoserver.azurecr.io \
                    -Ddocker.image.prefix=aehrc-rvf \
                    -Ddocker.image.tag=$(Build.SourceVersion)
                ls -la target/jib-image.tar

          - task: PublishPipelineArtifact@1
            displayName: 'Publish the image tarball'
            condition: succeeded()
            inputs:
              targetPath: 'target/jib-image.tar'
              artifact: 'rvf-image'

          - task: PublishTestResults@2
            displayName: 'Publish the comparison as test results'
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '$(workdir)/engine-ab.xml'
              testRunTitle: 'MySQL vs DuckDB'
              failTaskOnFailedTests: false

          - task: Bash@3
            displayName: 'Make sure there is something to publish'
            condition: always()
            # A failure before the A/B ran leaves $(workdir) absent, and the
            # publish below then fails with "Path does not exist" - a second red
            # X that is not the cause and reads like one. Build 16305 showed
            # both: the real failure was the JDK, and this was the louder of the
            # two errors.
            inputs:
              targetType: 'inline'
              script: |
                set -euo pipefail
                mkdir -p "$(workdir)"
                [ -n "$(ls -A "$(workdir)" 2>/dev/null)" ] || \
                  echo "The A/B did not get far enough to write anything." \
                    > "$(workdir)/nothing-ran.txt"

          - task: PublishPipelineArtifact@1
            displayName: 'Publish both reports and the comparison'
            condition: always()
            inputs:
              targetPath: '$(workdir)'
              artifact: 'engine-ab'
              # The two engine reports are the evidence for every claim the gate
              # makes, so they are published even when it fails - especially then.

          - task: Bash@3
            displayName: 'Logs on failure'
            condition: failed()
            inputs:
              targetType: 'inline'
              script: |
                for f in "$(workdir)/ab-mysql.log" "$(workdir)/ab-duck.log"; do
                  echo "=== $f ==="
                  tail -80 "$f" 2>/dev/null || echo "(absent)"
                done
